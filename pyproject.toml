[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-monorepo"
version = "0.1.2"
description = "Monorepo for NL2SQL Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Runtime dependencies live in packages/nl2sql
]

# Dev/test tooling (PEP 735). Install with: pip install --group dev
# pytest-randomly shuffles test order every run, so order-dependent tests -
# shared caches, leaked globals - fail loudly instead of only in CI.
[dependency-groups]
dev = [
  "pytest",
  "pytest-randomly",
  # A hung test is otherwise indistinguishable from a slow one, and CI has no
  # per-test deadline of its own. Run with `--timeout=<seconds>` when a suite
  # stops finishing.
  "pytest-timeout",
  # packages/api tests drive the app through fastapi.testclient.TestClient,
  # which imports httpx. No distribution in this repo depends on it.
  "httpx",
]

