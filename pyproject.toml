[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-monorepo"
version = "0.1.0"
description = "Monorepo for NL2SQL Agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  # Runtime dependencies live in packages/nl2sql
]

# Dev/test tooling (PEP 735). Install with: pip install --group dev
# pytest-randomly shuffles test order every run, so order-dependent tests -
# shared caches, leaked globals - fail loudly instead of only in CI.
[dependency-groups]
dev = [
  "pytest",
  "pytest-randomly",
]

