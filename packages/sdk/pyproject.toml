[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-sdk"
version = "0.8.0" # x-release-please-version
description = "Interfaces for nl2sql extensions: adapters, secret providers, stores and policy checks"
readme = "README.md"
license = "MIT"
keywords = ["nl2sql", "text-to-sql", "sql", "database", "adapter", "secrets", "policy", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.12"
dependencies = [
    # ConfigDict (contracts.py, schema.py) is pydantic v2 only; the old
    # >=1.10 floor advertised an install that cannot import.
    "pydantic>=2.0",
]

[project.optional-dependencies]
# nl2sql_sdk.sqlalchemy: the base an adapter on SQLAlchemy builds on.
sqlalchemy = ["SQLAlchemy>=2.0"]
# nl2sql_sdk.testing: the conformance kit an adapter's tests subclass.
testing = ["pytest>=8", "sqlglot"]

[project.urls]
Homepage = "https://github.com/nadeem4/nl2sql"
Documentation = "https://nadeem4.github.io/nl2sql/"
Source = "https://github.com/nadeem4/nl2sql"
Issues = "https://github.com/nadeem4/nl2sql/issues"
Demo = "https://nl2sql.codewithnk.com"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nl2sql_sdk*"]
