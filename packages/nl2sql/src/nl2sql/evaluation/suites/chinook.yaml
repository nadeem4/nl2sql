    select_items:
    - alias: first_name
      expr: {kind: column, alias: t1, column_name: FirstName}
    - alias: last_name
      expr: {kind: column, alias: t1, column_name: LastName}
    - alias: customer_count
      expr:
        kind: func
        func_name: COUNT
        is_aggregate: true
        args:
        - {kind: column, alias: t2, column_name: CustomerId}
    group_by:
    - expr: {kind: column, alias: t1, column_name: EmployeeId}
    - expr: {kind: column, alias: t1, column_name: FirstName}
    - expr: {kind: column, alias: t1, column_name: LastName}
    order_by:
    - direction: desc
      expr:
        kind: func
        func_name: COUNT
        is_aggregate: true
        args:
        - {kind: column, alias: t2, column_name: CustomerId}
    - direction: asc
      expr: {kind: column, alias: t1, column_name: EmployeeId}
