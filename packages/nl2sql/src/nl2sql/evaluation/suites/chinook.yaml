- id: chinook_045
  question: Which customers rank 11th to 20th by total spend?
  datasources: [chinook]
  status: approved
  origin: hand
  difficulty: medium
  tags: [join, aggregation, order-limit, offset, ties, rbac-denial]
  outcome: {admin: allowed, analyst: allowed, viewer: refused}
  tables: [Customer, Invoice]
  columns: [Customer.CustomerId, Customer.FirstName, Customer.LastName, Invoice.CustomerId, Invoice.Total]
  order_matters: false
  sql: |
    SELECT c.FirstName, c.LastName, ROUND(SUM(i.Total), 2) AS total_spend
    FROM Customer c JOIN Invoice i ON i.CustomerId = c.CustomerId
    GROUP BY c.CustomerId
    ORDER BY total_spend DESC, c.CustomerId
