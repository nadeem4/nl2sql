  - {PlaylistId: 5, Name: 90’s Music, genre_count: 16}
  - {PlaylistId: 8, Name: Music, genre_count: 20}
  - {PlaylistId: 10, Name: TV Shows, genre_count: 5}
  plan:
    tables:
    - {name: Playlist, alias: t1}
    - {name: PlaylistTrack, alias: t2}
    - {name: Track, alias: t3}
    joins:
    - left_alias: t1
      right_alias: t2
      join_type: inner
      condition:
        kind: binary
        op: '='
        left: {kind: column, alias: t1, column_name: PlaylistId}
        right: {kind: column, alias: t2, column_name: PlaylistId}
    - left_alias: t2
      right_alias: t3
      join_type: inner
      condition:
        kind: binary
        op: '='
        left: {kind: column, alias: t2, column_name: TrackId}
        right: {kind: column, alias: t3, column_name: TrackId}
    select_items:
    - alias: playlist_id
      expr: {kind: column, alias: t1, column_name: PlaylistId}
    - alias: playlist_name
      expr: {kind: column, alias: t1, column_name: Name}
    - alias: genre_count
      expr:
        kind: func
        func_name: COUNT
        is_aggregate: true
        distinct: true
        args:
        - {kind: column, alias: t3, column_name: GenreId}
    group_by:
    - expr: {kind: column, alias: t1, column_name: PlaylistId}
    - expr: {kind: column, alias: t1, column_name: Name}
    having:
      kind: binary
      op: '>'
      left:
        kind: func
        func_name: COUNT
        is_aggregate: true
        distinct: true
        args:
        - {kind: column, alias: t3, column_name: GenreId}
      right: {kind: literal, value: 3}
    order_by:
    - direction: asc
      expr: {kind: column, alias: t1, column_name: PlaylistId}
