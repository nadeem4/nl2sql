- id: chinook_046
  question: How many invoices were issued in the most recent month in the data?
  datasources: [chinook]
  status: approved
  origin: hand
  difficulty: medium
  tags: [single-table, filter, date, data-range, rbac-denial]
  outcome: {admin: allowed, analyst: allowed, viewer: refused}
  tables: [Invoice]
  columns: [Invoice.InvoiceId, Invoice.InvoiceDate]
  order_matters: false
  sql: |
    SELECT COUNT(InvoiceId) AS invoice_count
    FROM Invoice
    WHERE InvoiceDate >= '2013-12-01' AND InvoiceDate < '2014-01-01'
  rows:
  - {invoice_count: 7}
  plan:
    tables:
    - {name: Invoice, alias: t1}
    select_items:
    - alias: invoice_count
      expr:
        kind: func
        func_name: COUNT
        is_aggregate: true
        args:
        - {kind: column, alias: t1, column_name: InvoiceId}
    where:
      kind: binary
      op: AND
      left:
        kind: binary
        op: '>='
        left: {kind: column, alias: t1, column_name: InvoiceDate}
        right: {kind: literal, value: '2013-12-01'}
      right:
        kind: binary
        op: <
        left: {kind: column, alias: t1, column_name: InvoiceDate}
        right: {kind: literal, value: '2014-01-01'}
    reasoning: The data ends on 2013-12-22, so the most recent month is December 2013; count its invoices.

