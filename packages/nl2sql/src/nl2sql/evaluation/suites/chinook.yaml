    JOIN Customer c ON c.SupportRepId = e.EmployeeId
    GROUP BY e.EmployeeId
    ORDER BY customer_count DESC, e.EmployeeId
    LIMIT 1
  alt_rows:
  - - {employee: Jane Peacock, customer_count: 21}
  plan:
    tables:
    - {name: Employee, alias: t1}
    - {name: Customer, alias: t2}
    joins:
    - left_alias: t1
      right_alias: t2
      join_type: inner
      condition:
        kind: binary
        op: '='
        left: {kind: column, alias: t1, column_name: EmployeeId}
