  - {genre: Alternative, track: Reach Down, milliseconds: 672773}
  - {genre: Alternative & Punk, track: Homecoming / The Death Of St. Jimmy / East 12th St. / Nobody Likes You / Rock And Roll
      Girlfriend / We're Coming Home Again, milliseconds: 558602}
  - {genre: Blues, track: Talkin' 'Bout Women Obviously, milliseconds: 589531}
  - {genre: Bossa Nova, track: Samba Da Bênção, milliseconds: 409965}
  - {genre: Classical, track: 'Adagio for Strings from the String Quartet, Op. 11', milliseconds: 596519}
  - {genre: Comedy, track: The Job, milliseconds: 2541875}
  - {genre: Drama, track: Through a Looking Glass, milliseconds: 5088838}
  - {genre: Easy Listening, track: Mack The Knife, milliseconds: 292075}
  - {genre: Electronica/Dance, track: Just Another Story, milliseconds: 529684}
  - {genre: Heavy Metal, track: Dance Of Death, milliseconds: 516649}
  - {genre: Hip Hop/Rap, track: Se Liga, milliseconds: 410409}
  - {genre: Jazz, track: My Funny Valentine (Live), milliseconds: 907520}
  - {genre: Latin, track: Faroeste Caboclo, milliseconds: 543007}
  - {genre: Metal, track: Rime of the Ancient Mariner, milliseconds: 816509}
  - {genre: Opera, track: 'Die Zauberflöte, K.620: "Der Hölle Rache Kocht in Meinem Herze"', milliseconds: 174813}
  - {genre: Pop, track: Amy Amy Amy (Outro), milliseconds: 663426}
  - {genre: R&B/Soul, track: Rehab (Hot Chip Remix), milliseconds: 418293}
  - {genre: Reggae, track: Equal Rights Downpresser Man, milliseconds: 366733}
  - {genre: Rock, track: Dazed And Confused, milliseconds: 1612329}
  - {genre: Rock And Roll, track: Slow Down, milliseconds: 163265}
  - {genre: Sci Fi & Fantasy, track: 'Greetings from Earth, Pt. 1', milliseconds: 2960293}
  - {genre: Science Fiction, track: Hero, milliseconds: 2713755}
  - {genre: Soundtrack, track: Always Forever Now, milliseconds: 383764}
  - {genre: TV Shows, track: Occupation / Precipice, milliseconds: 5286953}
  - {genre: World, track: I Ka Barra (Your Work), milliseconds: 300605}
  plan:
    tables:
    - {name: Track, alias: t1}
    - {name: Genre, alias: t2}
    - {name: Track, alias: t3}
    joins:
    - left_alias: t1
      right_alias: t2
      join_type: inner
      condition:
        kind: binary
        op: '='
        left: {kind: column, alias: t1, column_name: GenreId}
        right: {kind: column, alias: t2, column_name: GenreId}
    - left_alias: t2
      right_alias: t3
      join_type: left
      condition:
        kind: binary
        op: AND
        left:
          kind: binary
          op: '='
          left: {kind: column, alias: t2, column_name: GenreId}
          right: {kind: column, alias: t3, column_name: GenreId}
        right:
          kind: binary
          op: OR
          left:
            kind: binary
            op: '>'
            left: {kind: column, alias: t3, column_name: Milliseconds}
            right: {kind: column, alias: t1, column_name: Milliseconds}
          right:
            kind: binary
            op: AND
            left:
              kind: binary
              op: '='
              left: {kind: column, alias: t3, column_name: Milliseconds}
              right: {kind: column, alias: t1, column_name: Milliseconds}
            right:
              kind: binary
              op: <
              left: {kind: column, alias: t3, column_name: TrackId}
              right: {kind: column, alias: t1, column_name: TrackId}
    select_items:
    - alias: genre
      expr: {kind: column, alias: t2, column_name: Name}
    - alias: track
      expr: {kind: column, alias: t1, column_name: Name}
    - alias: milliseconds
      expr: {kind: column, alias: t1, column_name: Milliseconds}
    where:
      kind: binary
      op: IS
      left: {kind: column, alias: t3, column_name: TrackId}
      right: {kind: literal, is_null: true}
    order_by:
    - direction: asc
      expr: {kind: column, alias: t2, column_name: Name}
    reasoning: Keep each track for which no longer track (ties to the lower TrackId) exists in its genre.

- id: chinook_009
  question: Which customers bought jazz tracks but never rock?
  datasources: [chinook]
  status: approved
  origin: hand
  difficulty: hard
  tags: [multi-join, filter, rbac-denial]
  outcome: {admin: allowed, analyst: allowed, viewer: refused}
  tables: [Customer, Genre, Invoice, InvoiceLine, Track]
  columns: [Customer.CustomerId, Customer.FirstName, Customer.LastName, Invoice.InvoiceId, Invoice.CustomerId, InvoiceLine.InvoiceId,
    InvoiceLine.TrackId, Track.TrackId, Track.GenreId, Genre.GenreId, Genre.Name]
  order_matters: false
  sql: |
    WITH bought AS (
      SELECT DISTINCT i.CustomerId, g.Name AS genre
      FROM Invoice i
      JOIN InvoiceLine il ON il.InvoiceId = i.InvoiceId
