- id: chinook_044
  question: Which 5 customers bought the most jazz tracks?
  datasources: [chinook]
  status: approved
  origin: hand
  difficulty: medium
  tags: [multi-join, aggregation, top-n, rbac-denial]
  outcome: {admin: allowed, analyst: allowed, viewer: refused}
