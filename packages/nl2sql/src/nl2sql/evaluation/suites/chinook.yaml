  columns: [Employee.EmployeeId, Employee.FirstName, Employee.LastName, Customer.SupportRepId, Customer.CustomerId]
  order_matters: true
  sql: |
    SELECT e.FirstName, e.LastName, COUNT(c.CustomerId) AS customer_count
    FROM Employee e JOIN Customer c ON c.SupportRepId = e.EmployeeId
    GROUP BY e.EmployeeId
    ORDER BY customer_count DESC, e.EmployeeId
