# The Chinook gold suite: 47 hand-written cases over the demo's Chinook database.
# Moved unchanged from chinook_gold.yaml and chinook_gold_plans.yaml (wave_a.md,
# section 8); test_chinook_suite_holds_the_gold_data_unchanged pins the data.
#
# rows and alt_rows are never typed by hand: engine.evals.regenerate writes them
# by running sql and each alt_sql through the datasource's adapter. A new accepted
# answer is a reviewed alt_sql, then regenerate; never an edit to rows.
#
# plan is the hand-written PlanModel mode plans serves through the gold-plan fake
# LLM. Every plan reads exactly the case's tables and selects the rows' columns in
# order; aliases are free (rows are compared by value). PlanModel has no
# subqueries or window functions, so:
#   chinook_008 (longest track per genre) is an anti-join: LEFT JOIN a longer
#     track of the same genre and keep rows where none exists.
#   chinook_009 (jazz but never rock) counts genres per customer in HAVING.
#   chinook_039 (never purchased) is an anti-join on InvoiceLine.

version: 1
cases:

- id: chinook_001
  question: How many customers do we have, by country?
  datasources: [chinook]
  status: approved
  origin: hand
  difficulty: easy
  tags: [aggregation, rbac-denial]
  outcome: {admin: allowed, analyst: allowed, viewer: refused}
  tables: [Customer]
  columns: [Customer.Country, Customer.CustomerId]
  order_matters: false
  sql: |
    SELECT Country, COUNT(CustomerId) AS customer_count
    FROM Customer
    GROUP BY Country
    ORDER BY customer_count DESC, Country
  rows:
  - {Country: USA, customer_count: 13}
  - {Country: Canada, customer_count: 8}
  - {Country: Brazil, customer_count: 5}
  - {Country: France, customer_count: 5}
  - {Country: Germany, customer_count: 4}
  - {Country: United Kingdom, customer_count: 3}
  - {Country: Czech Republic, customer_count: 2}
  - {Country: India, customer_count: 2}
  - {Country: Portugal, customer_count: 2}
  - {Country: Argentina, customer_count: 1}
  - {Country: Australia, customer_count: 1}
  - {Country: Austria, customer_count: 1}
  - {Country: Belgium, customer_count: 1}
  - {Country: Chile, customer_count: 1}
  - {Country: Denmark, customer_count: 1}
  - {Country: Finland, customer_count: 1}
  - {Country: Hungary, customer_count: 1}
  - {Country: Ireland, customer_count: 1}
  - {Country: Italy, customer_count: 1}
  - {Country: Netherlands, customer_count: 1}
  - {Country: Norway, customer_count: 1}
  - {Country: Poland, customer_count: 1}
  - {Country: Spain, customer_count: 1}
  - {Country: Sweden, customer_count: 1}
  plan:
    tables:
    - {name: Customer, alias: t1}
    select_items:
    - alias: country
      expr: {kind: column, alias: t1, column_name: Country}
    - alias: customer_count
      expr:
        kind: func
        func_name: COUNT
        is_aggregate: true
        args:
        - {kind: column, alias: t1, column_name: CustomerId}
    group_by:
    - expr: {kind: column, alias: t1, column_name: Country}
    order_by:
    - direction: desc
      expr:
        kind: func
        func_name: COUNT
        is_aggregate: true
        args:
        - {kind: column, alias: t1, column_name: CustomerId}
    - direction: asc
      expr: {kind: column, alias: t1, column_name: Country}
    reasoning: Count customers per country.

- id: chinook_002
  question: Who are the top 5 customers by total spend?
  datasources: [chinook]
  status: approved
  origin: hand
  difficulty: medium
  tags: [join, aggregation, order-limit, ties, paraphrase, rbac-denial]
  paraphrase_group: top_customers
  outcome: {admin: allowed, analyst: allowed, viewer: refused}
  tables: [Customer, Invoice]
  columns: [Customer.CustomerId, Customer.FirstName, Customer.LastName, Invoice.CustomerId, Invoice.Total]
  order_matters: false
  sql: |
    SELECT c.FirstName, c.LastName, ROUND(SUM(i.Total), 2) AS total_spend
    FROM Customer c JOIN Invoice i ON i.CustomerId = c.CustomerId
    GROUP BY c.CustomerId
    ORDER BY total_spend DESC, c.CustomerId
    LIMIT 5
  rows:
  - {FirstName: Helena, LastName: Holý, total_spend: 49.62}
  - {FirstName: Richard, LastName: Cunningham, total_spend: 47.62}
  - {FirstName: Luis, LastName: Rojas, total_spend: 46.62}
  - {FirstName: Ladislav, LastName: Kovács, total_spend: 45.62}
  - {FirstName: Hugh, LastName: O'Reilly, total_spend: 45.62}
  alt_sql:
  - |
    SELECT c.FirstName || ' ' || c.LastName AS customer, ROUND(SUM(i.Total), 2) AS total_spend
    FROM Customer c
    JOIN Invoice i ON i.CustomerId = c.CustomerId
    GROUP BY c.CustomerId
    ORDER BY total_spend DESC, c.CustomerId
    LIMIT 5
  alt_rows:
  - - {customer: Helena Holý, total_spend: 49.62}
    - {customer: Richard Cunningham, total_spend: 47.62}
    - {customer: Luis Rojas, total_spend: 46.62}
    - {customer: Ladislav Kovács, total_spend: 45.62}
    - {customer: Hugh O'Reilly, total_spend: 45.62}
  plan:
    tables:
    - {name: Customer, alias: t1}
    - {name: Invoice, alias: t2}
    joins:
    - left_alias: t1
      right_alias: t2
      join_type: inner
      condition:
        kind: binary
        op: '='
        left: {kind: column, alias: t1, column_name: CustomerId}
        right: {kind: column, alias: t2, column_name: CustomerId}
    select_items:
    - alias: first_name
      expr: {kind: column, alias: t1, column_name: FirstName}
    - alias: last_name
      expr: {kind: column, alias: t1, column_name: LastName}
    - alias: total_spend
      expr:
        kind: func
        func_name: ROUND
        args:
        - kind: func
          func_name: SUM
          is_aggregate: true
          args:
          - {kind: column, alias: t2, column_name: Total}
        - {kind: literal, value: 2}
    group_by:
    - expr: {kind: column, alias: t1, column_name: CustomerId}
    - expr: {kind: column, alias: t1, column_name: FirstName}
    - expr: {kind: column, alias: t1, column_name: LastName}
    order_by:
    - direction: desc
      expr:
        kind: func
        func_name: ROUND
        args:
        - kind: func
          func_name: SUM
          is_aggregate: true
          args:
          - {kind: column, alias: t2, column_name: Total}
        - {kind: literal, value: 2}
    - direction: asc
      expr: {kind: column, alias: t1, column_name: CustomerId}
    limit: 5
    reasoning: Sum invoice totals per customer and keep the five largest.

- id: chinook_003
  question: Which artist has the most albums?
  datasources: [chinook]
  status: approved
  origin: hand
  difficulty: easy
  tags: [join, aggregation, order-limit, paraphrase]
  paraphrase_group: artist_most_albums
  outcome: {admin: allowed, analyst: allowed, viewer: allowed}
  tables: [Album, Artist]
  columns: [Artist.ArtistId, Artist.Name, Album.ArtistId, Album.AlbumId]
  order_matters: true
  sql: |
    SELECT ar.Name, COUNT(al.AlbumId) AS album_count
    FROM Artist ar JOIN Album al ON al.ArtistId = ar.ArtistId
    GROUP BY ar.ArtistId
    ORDER BY album_count DESC, ar.ArtistId
    LIMIT 1
  rows:
  - {Name: Iron Maiden, album_count: 21}
  plan:
    tables:
    - {name: Artist, alias: t1}
    - {name: Album, alias: t2}
    joins:
    - left_alias: t1
      right_alias: t2
      join_type: inner
      condition:
        kind: binary
        op: '='
        left: {kind: column, alias: t1, column_name: ArtistId}
        right: {kind: column, alias: t2, column_name: ArtistId}
    select_items:
    - alias: artist_name
      expr: {kind: column, alias: t1, column_name: Name}
    - alias: album_count
      expr:
        kind: func
        func_name: COUNT
        is_aggregate: true
        args:
        - {kind: column, alias: t2, column_name: AlbumId}
    group_by:
    - expr: {kind: column, alias: t1, column_name: ArtistId}
    - expr: {kind: column, alias: t1, column_name: Name}
    order_by:
    - direction: desc
      expr:
        kind: func
        func_name: COUNT
        is_aggregate: true
        args:
        - {kind: column, alias: t2, column_name: AlbumId}
    - direction: asc
      expr: {kind: column, alias: t1, column_name: ArtistId}
    limit: 1
    reasoning: Count albums per artist and keep the largest.

- id: chinook_004
  question: What is the total revenue per year?
  datasources: [chinook]
  status: approved
  origin: hand
  difficulty: medium
  tags: [aggregation, date, paraphrase, rbac-denial]
  paraphrase_group: revenue_per_year
  outcome: {admin: allowed, analyst: allowed, viewer: refused}
  tables: [Invoice]
  columns: [Invoice.InvoiceDate, Invoice.Total]
  order_matters: false
  sql: |
    SELECT strftime('%Y', InvoiceDate) AS year, ROUND(SUM(Total), 2) AS revenue
    FROM Invoice
    GROUP BY year
    ORDER BY year
  rows:
  - {year: '2009', revenue: 449.46}
  - {year: '2010', revenue: 481.45}
  - {year: '2011', revenue: 469.58}
  - {year: '2012', revenue: 477.53}
  - {year: '2013', revenue: 450.58}
  alt_sql:
  - |
    SELECT strftime('%Y-01-01', InvoiceDate) AS year, ROUND(SUM(Total), 2) AS revenue
    FROM Invoice
    GROUP BY year
    ORDER BY year
  alt_rows:
  - - {year: '2009-01-01', revenue: 449.46}
    - {year: '2010-01-01', revenue: 481.45}
    - {year: '2011-01-01', revenue: 469.58}
    - {year: '2012-01-01', revenue: 477.53}
    - {year: '2013-01-01', revenue: 450.58}
  plan:
    tables:
    - {name: Invoice, alias: t1}
    select_items:
    - alias: invoice_year
      expr:
        kind: func
        func_name: STRFTIME
        args:
        - {kind: literal, value: '%Y'}
        - {kind: column, alias: t1, column_name: InvoiceDate}
    - alias: revenue
      expr:
        kind: func
        func_name: ROUND
        args:
        - kind: func
          func_name: SUM
          is_aggregate: true
          args:
          - {kind: column, alias: t1, column_name: Total}
        - {kind: literal, value: 2}
    group_by:
    - expr:
        kind: func
        func_name: STRFTIME
        args:
        - {kind: literal, value: '%Y'}
        - {kind: column, alias: t1, column_name: InvoiceDate}
    order_by:
    - direction: asc
      expr:
        kind: func
        func_name: STRFTIME
        args:
        - {kind: literal, value: '%Y'}
        - {kind: column, alias: t1, column_name: InvoiceDate}
    reasoning: Sum invoice totals per invoice year.

- id: chinook_005
  question: Which genre sells the most tracks?
  datasources: [chinook]
  status: approved
  origin: hand
  difficulty: medium
  tags: [multi-join, aggregation, order-limit, rbac-denial]
  outcome: {admin: allowed, analyst: allowed, viewer: refused}
  tables: [Genre, InvoiceLine, Track]
  columns: [Genre.GenreId, Genre.Name, Track.TrackId, Track.GenreId, InvoiceLine.TrackId, InvoiceLine.Quantity]
  order_matters: true
  sql: |
    SELECT g.Name, SUM(il.Quantity) AS tracks_sold
    FROM InvoiceLine il
    JOIN Track t ON t.TrackId = il.TrackId
    JOIN Genre g ON g.GenreId = t.GenreId
    GROUP BY g.GenreId
    ORDER BY tracks_sold DESC, g.GenreId
    LIMIT 1
  rows:
  - {Name: Rock, tracks_sold: 835}
  plan:
    tables:
    - {name: InvoiceLine, alias: t1}
    - {name: Track, alias: t2}
    - {name: Genre, alias: t3}
    joins:
    - left_alias: t1
      right_alias: t2
      join_type: inner
      condition:
        kind: binary
        op: '='
        left: {kind: column, alias: t1, column_name: TrackId}
        right: {kind: column, alias: t2, column_name: TrackId}
    - left_alias: t2
      right_alias: t3
      join_type: inner
      condition:
        kind: binary
        op: '='
        left: {kind: column, alias: t2, column_name: GenreId}
        right: {kind: column, alias: t3, column_name: GenreId}
    select_items:
    - alias: genre_name
      expr: {kind: column, alias: t3, column_name: Name}
    - alias: tracks_sold
      expr:
        kind: func
        func_name: SUM
        is_aggregate: true
        args:
        - {kind: column, alias: t1, column_name: Quantity}
    group_by:
    - expr: {kind: column, alias: t3, column_name: GenreId}
    - expr: {kind: column, alias: t3, column_name: Name}
    order_by:
    - direction: desc
      expr:
        kind: func
        func_name: SUM
        is_aggregate: true
        args:
        - {kind: column, alias: t1, column_name: Quantity}
    - direction: asc
      expr: {kind: column, alias: t3, column_name: GenreId}
    limit: 1
    reasoning: Sum quantities sold per genre and keep the largest.

