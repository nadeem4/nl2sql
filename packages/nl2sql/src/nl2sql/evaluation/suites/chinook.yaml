- id: chinook_008
  question: What is the longest track in each genre?
  datasources: [chinook]
  status: approved
  origin: hand
  difficulty: hard
  tags: [join, aggregation]
  outcome: {admin: allowed, analyst: allowed, viewer: allowed}
  tables: [Genre, Track]
  columns: [Genre.GenreId, Genre.Name, Track.TrackId, Track.Name, Track.GenreId, Track.Milliseconds]
  order_matters: false
  sql: |
    SELECT genre, track, milliseconds
    FROM (
      SELECT g.Name AS genre, t.Name AS track, t.Milliseconds AS milliseconds,
             ROW_NUMBER() OVER (PARTITION BY g.GenreId ORDER BY t.Milliseconds DESC, t.TrackId) AS rn
      FROM Track t JOIN Genre g ON g.GenreId = t.GenreId
    )
    WHERE rn = 1
    ORDER BY genre
