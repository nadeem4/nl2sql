# The routing suite: which demo datasource (chinook, support, webanalytics) a
# question belongs to. Each case names the datasources a right answer needs;
# the routing scorer checks them (docs/evals/cases.md, "The routing suite").
#
# - gold: the Chinook suite's answerable questions, routing only (their answers
#   are checked in chinook.yaml).
# - sample: each demo datasource's sample questions, as nl2sql init --demo
#   writes them.
# - paraphrase, hand: questions written for routing, each read against the
#   datasource's schema. A few carry reviewed SQL, whose rows only
#   `nl2sql eval regenerate` writes.
# - cross-database: questions that need two datasources.
#
# A case without SQL is kind: routing: it says only where a question goes, and
# is left out of execution accuracy in every mode.
#
# Two answers are defensible for a few cases; the suite pins the first:
# - support.customers holds the same 59 customers as chinook.Customer (name,
#   email, country, city), so routing_chinook_gold_001 (customers by country)
#   and the gold questions that list customers by country or city could also
#   be answered from support.
# - routing_webanalytics_sample_04 (purchases per month in 2013) reads as
#   naturally as chinook's invoices per month; the demo files it under
#   webanalytics, as its sample question.
# A routing change that ranks the other one first fails the gate on these;
# read the flip before re-recording.
#
# CI runs it in mode retrieval (no key, no model) and gates every case:
# routing must rank one of the case's datasources first and shortlist all of
# them. Never edit rows by hand.
version: 1
cases:

