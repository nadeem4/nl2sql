- id: routing_support_hand_01
  question: What is the average satisfaction score by ticket category?
  datasources: [support]
  status: approved
  origin: hand
  tags: [routing, support, hand]
  outcome: {admin: allowed}
  tables: []
  columns: []
  order_matters: false
  sql: |
    SELECT category, AVG(satisfaction) AS avg_satisfaction
    FROM tickets
    GROUP BY category
    ORDER BY category
  rows:
  - {category: Account access, avg_satisfaction: 4.461538461538462}
  - {category: Billing, avg_satisfaction: 4.3125}
  - {category: Download, avg_satisfaction: 4.363636363636363}
  - {category: Feature request, avg_satisfaction: 4.357142857142857}
  - {category: Mobile app, avg_satisfaction: 4.354838709677419}
  - {category: Other, avg_satisfaction: 4.2631578947368425}
  - {category: Payment method, avg_satisfaction: 4.733333333333333}
  - {category: Playback, avg_satisfaction: 4.526315789473684}
  - {category: Refund request, avg_satisfaction: 3.875}
  - {category: Subscription, avg_satisfaction: 4.619047619047619}

