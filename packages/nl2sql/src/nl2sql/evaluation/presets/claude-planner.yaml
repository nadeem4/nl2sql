# Tier 2 benchmark config, an llm section: the planner and refiner on Claude
# Opus 5 (Anthropic's own API; needs the anthropic extra and ANTHROPIC_API_KEY),
# the rest on gpt-5.4. Opus 5 rejects sampling parameters, so no temperature is
# sent to it. No key is named: each provider's standard variable is read.
provider: openai
model: gpt-5.4
temperature: 0.0
agents:
  ast_planner: { provider: anthropic, model: claude-opus-5, temperature: null }
  refiner: { provider: anthropic, model: claude-opus-5, temperature: null }
