  - {ordinal: 0, direction: desc, expr: {kind: func, func_name: COUNT, is_aggregate: true, args: [{kind: column, alias: t2, column_name: CustomerId}]}}
  - {ordinal: 1, direction: asc, expr: {kind: column, alias: t1, column_name: EmployeeId}}
  reasoning: Count supported customers per employee, most first.

chinook_008:
  tables:
  - {name: Track, alias: t1, ordinal: 0}
  - {name: Genre, alias: t2, ordinal: 1}
  - {name: Track, alias: t3, ordinal: 2}
  joins:
  - left_alias: t1
    right_alias: t2
    join_type: inner
    ordinal: 0
    condition: {kind: binary, op: '=', left: {kind: column, alias: t1, column_name: GenreId}, right: {kind: column, alias: t2, column_name: GenreId}}
  - left_alias: t2
    right_alias: t3
    join_type: left
    ordinal: 1
    condition:
      kind: binary
      op: AND
      left: {kind: binary, op: '=', left: {kind: column, alias: t2, column_name: GenreId}, right: {kind: column, alias: t3, column_name: GenreId}}
      right:
        kind: binary
        op: OR
        left: {kind: binary, op: '>', left: {kind: column, alias: t3, column_name: Milliseconds}, right: {kind: column, alias: t1, column_name: Milliseconds}}
        right:
          kind: binary
          op: AND
          left: {kind: binary, op: '=', left: {kind: column, alias: t3, column_name: Milliseconds}, right: {kind: column, alias: t1, column_name: Milliseconds}}
          right: {kind: binary, op: '<', left: {kind: column, alias: t3, column_name: TrackId}, right: {kind: column, alias: t1, column_name: TrackId}}
  select_items:
  - {ordinal: 0, alias: genre, expr: {kind: column, alias: t2, column_name: Name}}
  - {ordinal: 1, alias: track, expr: {kind: column, alias: t1, column_name: Name}}
  - {ordinal: 2, alias: milliseconds, expr: {kind: column, alias: t1, column_name: Milliseconds}}
  where: {kind: binary, op: IS, left: {kind: column, alias: t3, column_name: TrackId}, right: {kind: literal, is_null: true}}
  order_by:
  - {ordinal: 0, direction: asc, expr: {kind: column, alias: t2, column_name: Name}}
  reasoning: Keep each track for which no longer track (ties to the lower TrackId) exists in its genre.

chinook_009:
  tables:
  - {name: Customer, alias: t1, ordinal: 0}
  - {name: Invoice, alias: t2, ordinal: 1}
  - {name: InvoiceLine, alias: t3, ordinal: 2}
  - {name: Track, alias: t4, ordinal: 3}
  - {name: Genre, alias: t5, ordinal: 4}
  joins:
  - left_alias: t1
    right_alias: t2
    join_type: inner
    ordinal: 0
    condition: {kind: binary, op: '=', left: {kind: column, alias: t1, column_name: CustomerId}, right: {kind: column, alias: t2, column_name: CustomerId}}
  - left_alias: t2
    right_alias: t3
    join_type: inner
    ordinal: 1
    condition: {kind: binary, op: '=', left: {kind: column, alias: t2, column_name: InvoiceId}, right: {kind: column, alias: t3, column_name: InvoiceId}}
  - left_alias: t3
    right_alias: t4
    join_type: inner
    ordinal: 2
    condition: {kind: binary, op: '=', left: {kind: column, alias: t3, column_name: TrackId}, right: {kind: column, alias: t4, column_name: TrackId}}
  - left_alias: t4
    right_alias: t5
    join_type: inner
    ordinal: 3
    condition: {kind: binary, op: '=', left: {kind: column, alias: t4, column_name: GenreId}, right: {kind: column, alias: t5, column_name: GenreId}}
  select_items:
  - {ordinal: 0, alias: first_name, expr: {kind: column, alias: t1, column_name: FirstName}}
  - {ordinal: 1, alias: last_name, expr: {kind: column, alias: t1, column_name: LastName}}
  group_by:
  - {ordinal: 0, expr: {kind: column, alias: t1, column_name: CustomerId}}
  - {ordinal: 1, expr: {kind: column, alias: t1, column_name: FirstName}}
  - {ordinal: 2, expr: {kind: column, alias: t1, column_name: LastName}}
  having:
    kind: binary
    op: AND
    left:
      kind: binary
      op: '>'
      left:
        kind: func
        func_name: SUM
        is_aggregate: true
        args:
        - kind: case
          whens: [{ordinal: 0, condition: {kind: binary, op: '=', left: {kind: column, alias: t5, column_name: Name}, right: {kind: literal, value: Jazz}}, result: {kind: literal, value: 1}}]
          else_expr: {kind: literal, value: 0}
      right: {kind: literal, value: 0}
    right:
      kind: binary
      op: '='
      left:
        kind: func
        func_name: SUM
        is_aggregate: true
        args:
        - kind: case
          whens: [{ordinal: 0, condition: {kind: binary, op: '=', left: {kind: column, alias: t5, column_name: Name}, right: {kind: literal, value: Rock}}, result: {kind: literal, value: 1}}]
          else_expr: {kind: literal, value: 0}
      right: {kind: literal, value: 0}
  order_by:
  - {ordinal: 0, direction: asc, expr: {kind: column, alias: t1, column_name: CustomerId}}
  reasoning: Per customer, count purchased Jazz and Rock lines; keep those with Jazz and no Rock.

chinook_010:
