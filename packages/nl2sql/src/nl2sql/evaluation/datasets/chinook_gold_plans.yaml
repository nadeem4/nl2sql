  select_items:
  - {ordinal: 0, alias: invoice_month, expr: {kind: func, func_name: STRFTIME, args: [{kind: literal, value: '%Y-%m'}, {kind: column, alias: t1, column_name: InvoiceDate}]}}
  - ordinal: 1
    alias: revenue
    expr: {kind: func, func_name: ROUND, args: [{kind: func, func_name: SUM, is_aggregate: true, args: [{kind: column, alias: t1, column_name: Total}]}, {kind: literal, value: 2}]}
  where:
    kind: binary
    op: AND
    left:
      kind: binary
      op: AND
      left: {kind: binary, op: '=', left: {kind: column, alias: t2, column_name: Country}, right: {kind: literal, value: USA}}
      right: {kind: binary, op: '>=', left: {kind: column, alias: t1, column_name: InvoiceDate}, right: {kind: literal, value: '2013-01-01'}}
    right: {kind: binary, op: '<', left: {kind: column, alias: t1, column_name: InvoiceDate}, right: {kind: literal, value: '2014-01-01'}}
  group_by:
  - {ordinal: 0, expr: {kind: func, func_name: STRFTIME, args: [{kind: literal, value: '%Y-%m'}, {kind: column, alias: t1, column_name: InvoiceDate}]}}
  order_by:
  - {ordinal: 0, direction: asc, expr: {kind: func, func_name: STRFTIME, args: [{kind: literal, value: '%Y-%m'}, {kind: column, alias: t1, column_name: InvoiceDate}]}}
  reasoning: Sum 2013 invoice totals of USA customers per month.

