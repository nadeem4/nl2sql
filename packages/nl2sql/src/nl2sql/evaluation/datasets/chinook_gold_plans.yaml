# Hand-written PlanModel (the planner's typed AST) for every answerable question
# in chinook_gold.yaml, keyed by question id. Tier 1 serves these through a fake
# LLM, so the validator, generator and executor are what is under test.
#
# Every plan reads exactly the question's needed_tables and selects the gold
# result's columns in order; aliases are free (rows are compared by value).
# PlanModel has no subqueries, window functions or DISTINCT aggregates, so:
#   chinook_008 (longest track per genre) is an anti-join: LEFT JOIN a longer
#     track of the same genre and keep rows where none exists.
#   chinook_009 (jazz but never rock) counts genres per customer in HAVING.
#   chinook_011 and chinook_034 write COUNT(DISTINCT x) as COUNT over a
#     function named DISTINCT, which renders as COUNT(DISTINCT(x)).
#   chinook_039 (never purchased) is an anti-join on InvoiceLine.

chinook_001:
  tables: [{name: Customer, alias: t1, ordinal: 0}]
  select_items:
  - {ordinal: 0, alias: country, expr: {kind: column, alias: t1, column_name: Country}}
  - {ordinal: 1, alias: customer_count, expr: {kind: func, func_name: COUNT, is_aggregate: true, args: [{kind: column, alias: t1, column_name: CustomerId}]}}
  group_by:
  - {ordinal: 0, expr: {kind: column, alias: t1, column_name: Country}}
  order_by:
  - {ordinal: 0, direction: desc, expr: {kind: func, func_name: COUNT, is_aggregate: true, args: [{kind: column, alias: t1, column_name: CustomerId}]}}
  - {ordinal: 1, direction: asc, expr: {kind: column, alias: t1, column_name: Country}}
  reasoning: Count customers per country.

chinook_002: &top_customers
  tables:
  - {name: Customer, alias: t1, ordinal: 0}
  - {name: Invoice, alias: t2, ordinal: 1}
  joins:
  - left_alias: t1
    right_alias: t2
    join_type: inner
    ordinal: 0
    condition: {kind: binary, op: '=', left: {kind: column, alias: t1, column_name: CustomerId}, right: {kind: column, alias: t2, column_name: CustomerId}}
  select_items:
  - {ordinal: 0, alias: first_name, expr: {kind: column, alias: t1, column_name: FirstName}}
  - {ordinal: 1, alias: last_name, expr: {kind: column, alias: t1, column_name: LastName}}
  - ordinal: 2
    alias: total_spend
    expr: {kind: func, func_name: ROUND, args: [{kind: func, func_name: SUM, is_aggregate: true, args: [{kind: column, alias: t2, column_name: Total}]}, {kind: literal, value: 2}]}
  group_by:
  - {ordinal: 0, expr: {kind: column, alias: t1, column_name: CustomerId}}
  - {ordinal: 1, expr: {kind: column, alias: t1, column_name: FirstName}}
  - {ordinal: 2, expr: {kind: column, alias: t1, column_name: LastName}}
  order_by:
  - ordinal: 0
    direction: desc
    expr: {kind: func, func_name: ROUND, args: [{kind: func, func_name: SUM, is_aggregate: true, args: [{kind: column, alias: t2, column_name: Total}]}, {kind: literal, value: 2}]}
  - {ordinal: 1, direction: asc, expr: {kind: column, alias: t1, column_name: CustomerId}}
  limit: 5
  reasoning: Sum invoice totals per customer and keep the five largest.

chinook_003: &artist_most_albums
  tables:
  - {name: Artist, alias: t1, ordinal: 0}
  - {name: Album, alias: t2, ordinal: 1}
  joins:
  - left_alias: t1
    right_alias: t2
    join_type: inner
    ordinal: 0
    condition: {kind: binary, op: '=', left: {kind: column, alias: t1, column_name: ArtistId}, right: {kind: column, alias: t2, column_name: ArtistId}}
  select_items:
  - {ordinal: 0, alias: artist_name, expr: {kind: column, alias: t1, column_name: Name}}
  - {ordinal: 1, alias: album_count, expr: {kind: func, func_name: COUNT, is_aggregate: true, args: [{kind: column, alias: t2, column_name: AlbumId}]}}
  group_by:
  - {ordinal: 0, expr: {kind: column, alias: t1, column_name: ArtistId}}
  - {ordinal: 1, expr: {kind: column, alias: t1, column_name: Name}}
  order_by:
  - {ordinal: 0, direction: desc, expr: {kind: func, func_name: COUNT, is_aggregate: true, args: [{kind: column, alias: t2, column_name: AlbumId}]}}
  - {ordinal: 1, direction: asc, expr: {kind: column, alias: t1, column_name: ArtistId}}
  limit: 1
  reasoning: Count albums per artist and keep the largest.

chinook_004: &revenue_per_year
  tables: [{name: Invoice, alias: t1, ordinal: 0}]
  select_items:
  - {ordinal: 0, alias: invoice_year, expr: {kind: func, func_name: STRFTIME, args: [{kind: literal, value: '%Y'}, {kind: column, alias: t1, column_name: InvoiceDate}]}}
  - ordinal: 1
    alias: revenue
    expr: {kind: func, func_name: ROUND, args: [{kind: func, func_name: SUM, is_aggregate: true, args: [{kind: column, alias: t1, column_name: Total}]}, {kind: literal, value: 2}]}
  group_by:
  - {ordinal: 0, expr: {kind: func, func_name: STRFTIME, args: [{kind: literal, value: '%Y'}, {kind: column, alias: t1, column_name: InvoiceDate}]}}
  order_by:
  - {ordinal: 0, direction: asc, expr: {kind: func, func_name: STRFTIME, args: [{kind: literal, value: '%Y'}, {kind: column, alias: t1, column_name: InvoiceDate}]}}
  reasoning: Sum invoice totals per invoice year.

