chinook_007:
  tables:
  - {name: Employee, alias: t1, ordinal: 0}
  - {name: Customer, alias: t2, ordinal: 1}
  joins:
  - left_alias: t1
    right_alias: t2
    join_type: inner
    ordinal: 0
