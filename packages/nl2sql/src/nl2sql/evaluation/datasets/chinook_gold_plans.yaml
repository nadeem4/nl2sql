  - {ordinal: 1, alias: playlist_name, expr: {kind: column, alias: t1, column_name: Name}}
  - {ordinal: 2, alias: genre_count, expr: {kind: func, func_name: COUNT, is_aggregate: true, args: [{kind: func, func_name: DISTINCT, args: [{kind: column, alias: t3, column_name: GenreId}]}]}}
  group_by:
  - {ordinal: 0, expr: {kind: column, alias: t1, column_name: PlaylistId}}
  - {ordinal: 1, expr: {kind: column, alias: t1, column_name: Name}}
  having:
    kind: binary
    op: '>'
    left: {kind: func, func_name: COUNT, is_aggregate: true, args: [{kind: func, func_name: DISTINCT, args: [{kind: column, alias: t3, column_name: GenreId}]}]}
    right: {kind: literal, value: 3}
  order_by:
  - {ordinal: 0, direction: asc, expr: {kind: column, alias: t1, column_name: PlaylistId}}
  reasoning: Count distinct genres per playlist and keep those above three.

