    - {month: '2013-10-01', revenue: 22.77}
    - {month: '2013-11-01', revenue: 0.99}
    - {month: '2013-12-01', revenue: 7.92}

- id: chinook_011
  question: Which playlists contain tracks from more than three genres?
  difficulty: hard
  tags: [multi-join, aggregation, having]
  needed_tables: [Playlist, PlaylistTrack, Track]
  needed_columns: [Playlist.PlaylistId, Playlist.Name, PlaylistTrack.PlaylistId, PlaylistTrack.TrackId, Track.TrackId, Track.GenreId]
  expected: {admin: allowed, analyst: allowed, viewer: allowed}
  order_matters: false
  gold_sql: |
    SELECT p.PlaylistId, p.Name, COUNT(DISTINCT t.GenreId) AS genre_count
    FROM Playlist p
    JOIN PlaylistTrack pt ON pt.PlaylistId = p.PlaylistId
    JOIN Track t ON t.TrackId = pt.TrackId
    GROUP BY p.PlaylistId
    HAVING COUNT(DISTINCT t.GenreId) > 3
    ORDER BY p.PlaylistId
  gold_result:
  - {PlaylistId: 1, Name: Music, genre_count: 20}
  - {PlaylistId: 3, Name: TV Shows, genre_count: 5}
  - {PlaylistId: 5, Name: 90’s Music, genre_count: 16}
  - {PlaylistId: 8, Name: Music, genre_count: 20}
  - {PlaylistId: 10, Name: TV Shows, genre_count: 5}

