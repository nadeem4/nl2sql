- id: chinook_005
  question: Which genre sells the most tracks?
  difficulty: medium
  tags: [multi-join, aggregation, order-limit, rbac-denial]
  needed_tables: [Genre, InvoiceLine, Track]
  needed_columns: [Genre.GenreId, Genre.Name, Track.TrackId, Track.GenreId, InvoiceLine.TrackId, InvoiceLine.Quantity]
  expected: {admin: allowed, analyst: allowed, viewer: refused}
  order_matters: true
  gold_sql: |
    SELECT g.Name, SUM(il.Quantity) AS tracks_sold
    FROM InvoiceLine il
    JOIN Track t ON t.TrackId = il.TrackId
    JOIN Genre g ON g.GenreId = t.GenreId
    GROUP BY g.GenreId
    ORDER BY tracks_sold DESC, g.GenreId
    LIMIT 1
  gold_result:
  - {Name: Rock, tracks_sold: 835}

