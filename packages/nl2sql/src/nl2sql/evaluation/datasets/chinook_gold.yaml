- id: chinook_001
  question: How many customers do we have, by country?
  difficulty: easy
  tags: [aggregation, rbac-denial]
  needed_tables: [Customer]
  needed_columns: [Customer.Country, Customer.CustomerId]
  expected: {admin: allowed, analyst: allowed, viewer: refused}
