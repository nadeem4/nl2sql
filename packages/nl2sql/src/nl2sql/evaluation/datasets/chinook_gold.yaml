- id: chinook_007
  question: Which employees support the most customers?
  difficulty: medium
  tags: [join, aggregation, rbac-denial]
  needed_tables: [Customer, Employee]
  needed_columns: [Employee.EmployeeId, Employee.FirstName, Employee.LastName, Customer.SupportRepId, Customer.CustomerId]
  expected: {admin: allowed, analyst: refused, viewer: refused}
  order_matters: true
  gold_sql: |
    SELECT e.FirstName, e.LastName, COUNT(c.CustomerId) AS customer_count
    FROM Employee e JOIN Customer c ON c.SupportRepId = e.EmployeeId
    GROUP BY e.EmployeeId
    ORDER BY customer_count DESC, e.EmployeeId
  gold_result:
  - {FirstName: Jane, LastName: Peacock, customer_count: 21}
  - {FirstName: Margaret, LastName: Park, customer_count: 20}
  - {FirstName: Steve, LastName: Johnson, customer_count: 18}
  alt_gold_sql:
  - |
    SELECT e.FirstName || ' ' || e.LastName AS employee, COUNT(c.CustomerId) AS customer_count
    FROM Employee e
    JOIN Customer c ON c.SupportRepId = e.EmployeeId
    GROUP BY e.EmployeeId
    ORDER BY customer_count DESC, e.EmployeeId
    LIMIT 1
  alt_gold_result:
  - - {employee: Jane Peacock, customer_count: 21}

- id: chinook_008
  question: What is the longest track in each genre?
  difficulty: hard
  tags: [join, aggregation]
  needed_tables: [Genre, Track]
  needed_columns: [Genre.GenreId, Genre.Name, Track.TrackId, Track.Name, Track.GenreId, Track.Milliseconds]
  expected: {admin: allowed, analyst: allowed, viewer: allowed}
  order_matters: false
  gold_sql: |
    SELECT genre, track, milliseconds
    FROM (
      SELECT g.Name AS genre, t.Name AS track, t.Milliseconds AS milliseconds,
             ROW_NUMBER() OVER (PARTITION BY g.GenreId ORDER BY t.Milliseconds DESC, t.TrackId) AS rn
