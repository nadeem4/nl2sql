- id: chinook_002
  question: Who are the top 5 customers by total spend?
  difficulty: medium
  tags: [join, aggregation, order-limit, ties, paraphrase, rbac-denial]
  paraphrase_group: top_customers
  needed_tables: [Customer, Invoice]
  needed_columns: [Customer.CustomerId, Customer.FirstName, Customer.LastName, Invoice.CustomerId, Invoice.Total]
  expected: {admin: allowed, analyst: allowed, viewer: refused}
  order_matters: false
  gold_sql: |
    SELECT c.FirstName, c.LastName, ROUND(SUM(i.Total), 2) AS total_spend
    FROM Customer c JOIN Invoice i ON i.CustomerId = c.CustomerId
    GROUP BY c.CustomerId
    ORDER BY total_spend DESC, c.CustomerId
    LIMIT 5
  gold_result:
  - {FirstName: Helena, LastName: Holý, total_spend: 49.62}
  - {FirstName: Richard, LastName: Cunningham, total_spend: 47.62}
  - {FirstName: Luis, LastName: Rojas, total_spend: 46.62}
  - {FirstName: Ladislav, LastName: Kovács, total_spend: 45.62}
  - {FirstName: Hugh, LastName: O'Reilly, total_spend: 45.62}
  alt_gold_sql:
  - |
    SELECT c.FirstName || ' ' || c.LastName AS customer, ROUND(SUM(i.Total), 2) AS total_spend
    FROM Customer c
    JOIN Invoice i ON i.CustomerId = c.CustomerId
    GROUP BY c.CustomerId
    ORDER BY total_spend DESC, c.CustomerId
    LIMIT 5
  alt_gold_result:
  - - {customer: Helena Holý, total_spend: 49.62}
    - {customer: Richard Cunningham, total_spend: 47.62}
    - {customer: Luis Rojas, total_spend: 46.62}
    - {customer: Ladislav Kovács, total_spend: 45.62}
    - {customer: Hugh O'Reilly, total_spend: 45.62}

- id: chinook_003
  question: Which artist has the most albums?
  difficulty: easy
  tags: [join, aggregation, order-limit, paraphrase]
  paraphrase_group: artist_most_albums
  needed_tables: [Album, Artist]
  needed_columns: [Artist.ArtistId, Artist.Name, Album.ArtistId, Album.AlbumId]
  expected: {admin: allowed, analyst: allowed, viewer: allowed}
  order_matters: true
  gold_sql: |
    SELECT ar.Name, COUNT(al.AlbumId) AS album_count
    FROM Artist ar JOIN Album al ON al.ArtistId = ar.ArtistId
    GROUP BY ar.ArtistId
    ORDER BY album_count DESC, ar.ArtistId
    LIMIT 1
  gold_result:
  - {Name: Iron Maiden, album_count: 21}

