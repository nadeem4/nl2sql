- id: chinook_032
  question: Which artist has earned the most revenue?
  difficulty: hard
  tags: [multi-join, aggregation, order-limit, rbac-denial]
  needed_tables: [Album, Artist, InvoiceLine, Track]
  needed_columns: [Artist.ArtistId, Artist.Name, Album.AlbumId, Album.ArtistId, Track.TrackId, Track.AlbumId, InvoiceLine.TrackId,
    InvoiceLine.UnitPrice, InvoiceLine.Quantity]
  expected: {admin: allowed, analyst: allowed, viewer: refused}
  order_matters: true
  gold_sql: |
    SELECT ar.Name, ROUND(SUM(il.UnitPrice * il.Quantity), 2) AS revenue
    FROM InvoiceLine il
    JOIN Track t ON t.TrackId = il.TrackId
    JOIN Album al ON al.AlbumId = t.AlbumId
    JOIN Artist ar ON ar.ArtistId = al.ArtistId
    GROUP BY ar.ArtistId
    ORDER BY revenue DESC, ar.ArtistId
    LIMIT 1
  gold_result:
  - {Name: Iron Maiden, revenue: 138.6}

- id: chinook_033
