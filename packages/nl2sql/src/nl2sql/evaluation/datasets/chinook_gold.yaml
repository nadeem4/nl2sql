- id: chinook_009
  question: Which customers bought jazz tracks but never rock?
  difficulty: hard
  tags: [multi-join, filter, rbac-denial]
  needed_tables: [Customer, Genre, Invoice, InvoiceLine, Track]
  needed_columns: [Customer.CustomerId, Customer.FirstName, Customer.LastName, Invoice.InvoiceId, Invoice.CustomerId, InvoiceLine.InvoiceId,
    InvoiceLine.TrackId, Track.TrackId, Track.GenreId, Genre.GenreId, Genre.Name]
  expected: {admin: allowed, analyst: allowed, viewer: refused}
  order_matters: false
  gold_sql: |
    WITH bought AS (
      SELECT DISTINCT i.CustomerId, g.Name AS genre
      FROM Invoice i
      JOIN InvoiceLine il ON il.InvoiceId = i.InvoiceId
      JOIN Track t ON t.TrackId = il.TrackId
      JOIN Genre g ON g.GenreId = t.GenreId
    )
    SELECT c.FirstName, c.LastName
    FROM Customer c
    WHERE c.CustomerId IN (SELECT CustomerId FROM bought WHERE genre = 'Jazz')
      AND c.CustomerId NOT IN (SELECT CustomerId FROM bought WHERE genre = 'Rock')
    ORDER BY c.CustomerId
  gold_result: []

- id: chinook_010
  question: What was the monthly revenue in 2013 for customers in the USA?
  difficulty: medium
  tags: [join, aggregation, date, filter, rbac-denial]
  needed_tables: [Customer, Invoice]
  needed_columns: [Customer.CustomerId, Customer.Country, Invoice.CustomerId, Invoice.InvoiceDate, Invoice.Total]
  expected: {admin: allowed, analyst: allowed, viewer: refused}
  order_matters: false
  gold_sql: |
    SELECT strftime('%Y-%m', i.InvoiceDate) AS month, ROUND(SUM(i.Total), 2) AS revenue
    FROM Invoice i JOIN Customer c ON c.CustomerId = i.CustomerId
    WHERE c.Country = 'USA' AND i.InvoiceDate >= '2013-01-01' AND i.InvoiceDate < '2014-01-01'
    GROUP BY month
    ORDER BY month
  gold_result:
  - {month: 2013-02, revenue: 13.86}
  - {month: 2013-04, revenue: 18.81}
  - {month: 2013-05, revenue: 0.99}
  - {month: 2013-07, revenue: 14.85}
  - {month: 2013-08, revenue: 0.99}
  - {month: 2013-09, revenue: 3.96}
  - {month: 2013-10, revenue: 22.77}
  - {month: 2013-11, revenue: 0.99}
  - {month: 2013-12, revenue: 7.92}
  alt_gold_sql:
  - |
    SELECT strftime('%Y-%m-01', i.InvoiceDate) AS month, ROUND(SUM(i.Total), 2) AS revenue
    FROM Invoice i
    JOIN Customer c ON c.CustomerId = i.CustomerId
    WHERE c.Country = 'USA' AND i.InvoiceDate >= '2013-01-01' AND i.InvoiceDate < '2014-01-01'
    GROUP BY month
    ORDER BY month
  alt_gold_result:
  - - {month: '2013-02-01', revenue: 13.86}
    - {month: '2013-04-01', revenue: 18.81}
    - {month: '2013-05-01', revenue: 0.99}
    - {month: '2013-07-01', revenue: 14.85}
