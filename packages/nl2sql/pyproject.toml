[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-engine"
version = "0.9.0" # x-release-please-version
description = "Ask a database questions in English: the model writes a typed query plan, never SQL, and the plan is checked against the schema and the caller's role before any SQL is generated"
readme = "README.md"
keywords = ["nl2sql", "text-to-sql", "natural language", "sql", "llm", "langgraph", "sqlglot", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
license = "MIT"
# Copies of the repository-root files: setuptools packs license files only from
# inside the project directory. The wheel vendors Chinook (MIT) and two OFL
# fonts, whose notices THIRD_PARTY_NOTICES.md carries.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
    "langgraph>=1.2,<2",
    "langchain>=0.2.0",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "chromadb>=1.5,<2",
    "nl2sql-sdk[sqlalchemy]~=0.9.0", # x-release-please-version
    "pydantic>=2.0",
    "sqlglot>=23.0.0",
    # For the parquet artifact store. The engine never imports it and polars
    # reads and writes local parquet without it; it stays until the remote
    # (s3/abfs) artifact store, which no test exercises, is shown not to need it.
    "pyarrow>=14.0.0",
    "pybreaker>=1.3.0",
    "polars>=1.44",
    "duckdb>=1.5",
    # CLI
    "rich>=13.0.0",
    # typer no longer has an [all] extra; asking for it only warns.
    "typer>=0.9.0",
    # nl2sql.config.load_env_file loads the .env next to nl2sql.yaml for the
    # entry points, and cli/commands/demo.py reads the demo's .env directly.
    "python-dotenv>=1.0.0",
    "inquirerpy>=0.3.4",
    # cli/main.py and cli/commands/policy.py import it directly; it used to
    # arrive only by way of typer and pydantic.
    "typing_extensions>=4.0",
    # nl2sql.tracing.replay serves recorded answers through an httpx transport;
    # it already arrives with openai, but is imported directly.
    "httpx>=0.23,<1",
]

# Every dialect adapter ships in this distribution; an extra only adds the
# database driver it needs to connect. sqlite needs none -- the driver is in
# the standard library -- so it has no extra.
[project.optional-dependencies]
# Claude through Anthropic's own Messages API (`provider: anthropic`). Not a
# core dependency: every other provider speaks the OpenAI wire format.
anthropic = ["langchain-anthropic>=1.7,<2"]
aws = ["boto3"]
azure = ["azure-identity", "azure-keyvault-secrets"]
# The browser playground `nl2sql demo` serves. The built page ships inside the
# wheel, so this extra adds only the server.
demo = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
duckdb = ["duckdb", "duckdb-engine"]
hashicorp = ["hvac"]
# `nl2sql mcp`: the engine as an MCP server over stdio, on the official SDK
# (structured tool results arrived in 1.10), and over HTTP (`--http`, from 0.9), which needs a server.
mcp = ["mcp>=1.10,<2", "uvicorn>=0.20.0"]
mssql = [
    "pyodbc>=4.0.0",
    "pymssql>=2.2.0; platform_system=='Linux'", # Optional fallback
]
mysql = ["pymysql[rsa]>=1.1.0"]  # rsa: cryptography, for MySQL 8's default caching_sha2_password login
# The `otel` observer: OpenTelemetry metrics and traces, exported over OTLP.
otel = ["opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0", "opentelemetry-exporter-otlp>=1.20.0"]
postgres = ["psycopg2-binary>=2.9"]
all = [
    "duckdb",
    "duckdb-engine",
    "pyodbc>=4.0.0",
    "pymssql>=2.2.0; platform_system=='Linux'",
    "pymysql[rsa]>=1.1.0",
    "psycopg2-binary>=2.9",
]

[project.urls]
Homepage = "https://github.com/nadeem4/nl2sql"
Documentation = "https://nadeem4.github.io/nl2sql/"
Source = "https://github.com/nadeem4/nl2sql"
Issues = "https://github.com/nadeem4/nl2sql/issues"
Demo = "https://nl2sql.codewithnk.com"

[project.scripts]
nl2sql = "nl2sql.cli.main:main"

[project.entry-points."nl2sql.adapters"]
duckdb = "nl2sql.adapters.duckdb.adapter:DuckdbAdapter"
mssql = "nl2sql.adapters.mssql.adapter:MssqlAdapter"
mysql = "nl2sql.adapters.mysql.adapter:MysqlAdapter"
postgres = "nl2sql.adapters.postgres.adapter:PostgresAdapter"
sqlite = "nl2sql.adapters.sqlite.adapter:SqliteAdapter"

# The registry (nl2sql/registry.py) lists these by name and imports one only
# when a config uses it. A plugin package declares its own in the same groups.
[project.entry-points."nl2sql.llms"]
openai = "nl2sql.llm.providers:OPENAI"
anthropic = "nl2sql.llm.providers:ANTHROPIC"
openrouter = "nl2sql.llm.providers:OPENROUTER"
ollama = "nl2sql.llm.providers:OLLAMA"
openai_compatible = "nl2sql.llm.providers:OPENAI_COMPATIBLE"

[project.entry-points."nl2sql.embeddings"]
local = "nl2sql.embeddings.local:LOCAL"
openai = "nl2sql.embeddings.openai:OPENAI"
openai_compatible = "nl2sql.embeddings.openai:OPENAI_COMPATIBLE"

[project.entry-points."nl2sql.secrets"]
env = "nl2sql.secrets.providers.env:EnvSecretProvider"
aws = "nl2sql.secrets.providers.aws:AwsSecretProvider"
azure = "nl2sql.secrets.providers.azure:AzureSecretProvider"
hashicorp = "nl2sql.secrets.providers.hashi:HashiCorpSecretProvider"

# The built-in scorers engine.evals runs (nl2sql/evaluation/scorers/).
[project.entry-points."nl2sql.scorers"]
result_match = "nl2sql.evaluation.scorers.result_match:ResultMatch"
outcome = "nl2sql.evaluation.scorers.outcome:Outcome"
faithfulness = "nl2sql.evaluation.scorers.faithfulness:Faithfulness"
retrieval_recall = "nl2sql.evaluation.scorers.retrieval_recall:RetrievalRecall"
routing = "nl2sql.evaluation.scorers.routing:Routing"

# One group for the four store slots, so a store's name is unique across them.
[project.entry-points."nl2sql.stores"]
chroma = "nl2sql.storage.chroma:ChromaIndex"
sqlite = "nl2sql.storage.sqlite:SqliteState"
files = "nl2sql.storage.files:FilesTraces"
local = "nl2sql.storage.local:LocalResults"

[project.entry-points."nl2sql.observers"]
log = "nl2sql.observers.log:LogObserver"
audit = "nl2sql.observers.audit:AuditObserver"
otel = "nl2sql.observers.otel:OtelObserver"

# The built-in chat tools (docs/architecture/wave_c.md, section 4). A plugin declares its own in the same group.
[project.entry-points."nl2sql.chat_tools"]
chart = "nl2sql.chat_tools.chart:ChartTool"
diagram = "nl2sql.chat_tools.diagram:DiagramTool"
report = "nl2sql.chat_tools.report:ReportTool"
dashboard_edit = "nl2sql.chat_tools.dashboard_edit:DashboardEditTool"
dashboard_pin = "nl2sql.chat_tools.dashboard_pin:DashboardPinTool"

# The built-in knowledge source (docs/architecture/wave_b.md, section 3).
[project.entry-points."nl2sql.knowledge_sources"]
yaml = "nl2sql.knowledge.yaml_source:YamlKnowledgeSource"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nl2sql*"]

[tool.setuptools.package-data]
"*" = ["configs/*.yaml", ".env"]
"nl2sql.cli.demo" = ["recordings/*.json"]
"nl2sql.datasets" = ["*.sqlite", "*.yaml", "README.md"]
"nl2sql.evaluation" = ["suites/*.yaml"]
"nl2sql.evaluation.presets" = ["*.yaml"]
# The committed Vite build of web/playground: the wheel must carry the finished
# page so `pip install "nl2sql-engine[demo]"` needs no Node toolchain. The card
# the link preview names sits beside it rather than in `static/`, which the
# Vite build empties on every run.
"nl2sql.cli.demo.playground" = ["static/*", "assets/*", "assets/clips/*"]
