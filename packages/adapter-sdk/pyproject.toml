[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-adapter-sdk"
version = "0.1.2" # x-release-please-version
description = "Shared adapter contracts for NL2SQL"
requires-python = ">=3.12"
dependencies = [
    # ConfigDict (contracts.py, schema.py) is pydantic v2 only; the old
    # >=1.10 floor advertised an install that cannot import.
    "pydantic>=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["nl2sql_adapter_sdk*"]
