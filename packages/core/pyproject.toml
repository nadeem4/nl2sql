[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-core"
version = "0.1.0"
description = "Core orchestration engine for NL2SQL"
requires-python = ">=3.9"
dependencies = [
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
    "langgraph>=0.0.29",
    "langchain>=0.2.0",
    "langchain-chroma>=0.1.0",
    "langchain-openai>=0.1.0",
    "nl2sql-adapter-sdk~=0.1",
    "pydantic>=1.10",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "sqlglot>=23.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=1.5.0", # For metrics/evals
    "pyarrow>=14.0.0", # For the parquet artifact store
    "pybreaker>=1.3.0",
    "polars",
    "duckdb",
]

[project.optional-dependencies]
aws = ["boto3"]
azure = ["azure-identity", "azure-keyvault-secrets"]
hashicorp = ["hvac"]
mssql = ["nl2sql-mssql~=0.1"]
mysql = ["nl2sql-mysql~=0.1"]
postgres = ["nl2sql-postgres~=0.1"]
sqlite = ["nl2sql-sqlite~=0.1"]
sqlalchemy = ["nl2sql-adapter-sqlalchemy~=0.1"]
all = [
    "nl2sql-adapter-sqlalchemy~=0.1",
    "nl2sql-mssql~=0.1",
    "nl2sql-mysql~=0.1",
    "nl2sql-postgres~=0.1",
    "nl2sql-sqlite~=0.1"
]

# Scripts section removed as moved to CLI package

[tool.setuptools.packages.find]
where = ["src"]
include = ["nl2sql*"]

[tool.setuptools.package-data]
"*" = ["configs/*.yaml", ".env"]
