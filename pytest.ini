[pytest]
testpaths =
    packages/core/tests
    packages/adapters/tests
    packages/adapter-sqlalchemy/tests
    packages/cli/tests
    packages/api/tests
addopts = -ra
markers =
    e2e: end-to-end pipeline tests
    integration: needs external resources -- generated demo databases, or a
        downloaded embedding model. Run `nl2sql setup --demo --lite` first.
    llm: needs a real LLM API key (OPENAI_API_KEY). Costs money to run;
        never selected in CI. Often combined with `integration`.
