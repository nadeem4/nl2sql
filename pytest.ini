[pytest]
testpaths =
    packages/nl2sql/tests
    packages/api/tests
addopts = -ra
markers =
    e2e: end-to-end pipeline tests
    integration: needs external resources -- the demo's SQLite databases, which
        ship in the package, or the downloaded local embedding model. Run
        `pytest -m "integration and not llm"`; the first run downloads the model.
    llm: needs a real LLM API key (OPENAI_API_KEY). Costs money to run;
        never selected in CI. Often combined with `integration`.
    realdb: needs a real PostgreSQL, MySQL or SQL Server (the test bed). Start
        testbed/docker-compose.yml and set REALDB=compose.
