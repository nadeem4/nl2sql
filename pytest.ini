[pytest]
testpaths =
    packages/nl2sql/tests
    packages/api/tests
addopts = -ra
markers =
    e2e: end-to-end pipeline tests
    integration: needs external resources -- the generated Chinook demo
        database, or a downloaded embedding model. Run `nl2sql setup --demo`
        first.
    llm: needs a real LLM API key (OPENAI_API_KEY). Costs money to run;
        never selected in CI. Often combined with `integration`.
