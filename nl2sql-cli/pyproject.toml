[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-cli"
version = "0.10.0" # x-release-please-version
description = "The nl2sql command line: index, ask, review, evaluate and serve a database you query in English"
readme = "README.md"
license = "MIT"
keywords = ["nl2sql", "text-to-sql", "natural language", "sql", "llm", "cli", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
# It sits on the engine's facade and nothing else of this repository: the SDK is for adapter
# authors and the API is a separate process that `nl2sql demo` and `serve` start, so neither is a dependency.
dependencies = [
    "nl2sql-engine~=0.10.0", # x-release-please-version
    "rich>=13.0.0",
    # typer no longer has an [all] extra; asking for it only warns.
    "typer>=0.9.0",
    "typing_extensions>=4.0",
    # The terminal app, `nl2sql chat`; a normal dependency, not an extra.
    "textual>=0.80",
]

[project.optional-dependencies]
# `nl2sql demo` and `nl2sql serve` start the web server as a child process (`python -m nl2sql_api serve`), so this
# package never imports the API; without the extra they print the install line.
web = ["nl2sql-api~=0.10.0"] # x-release-please-version

[project.urls]
Homepage = "https://github.com/nadeem4/nl2sql"
Documentation = "https://nadeem4.github.io/nl2sql/"
Source = "https://github.com/nadeem4/nl2sql"
Issues = "https://github.com/nadeem4/nl2sql/issues"
Demo = "https://nl2sql.codewithnk.com"

[project.scripts]
nl2sql = "nl2sql_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nl2sql_cli*"]
