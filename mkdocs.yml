site_name: NL2SQL Platform
site_description: Reference documentation for the NL2SQL engine, CLI and REST API
site_author: Platform Engineering

theme:
  name: material
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
  palette: 
    - scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mermaid2
  - redirects:
      redirect_maps:
        extensions/add-adapter.md: extend/add-adapter.md
        extensions/add-chunk-types.md: extend/add-chunk-types.md
        extensions/extend-planner.md: extend/extend-planner.md
        extensions/add-execution-backend.md: extend/add-execution-backend.md
        development/index.md: extend/index.md
        development/releasing.md: contribute/releasing.md
        testing/architecture.md: contribute/testing.md
        testing/test-bed.md: contribute/test-bed.md
        testing/evaluation-dataset.md: evals/chinook-suite.md
        glossary.md: reference/glossary.md
        execution/isolation.md: architecture/isolation.md
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/nl2sql/src, packages/sdk/src]

# mike writes one docs build per version to gh-pages; this makes the
# Material theme render the version selector against mike's versions.json.
extra:
  version:
    provider: mike

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - attr_list

