# The Space's image, run locally.
#
#   cd deploy/huggingface && docker compose up --build
#   open http://localhost:7860
#
# Same Dockerfile, same hosted mode, same limits: what you see here is what the
# Space serves. Paste your own key under Settings; nothing is saved, here or
# there.
name: nl2sql-demo

services:
  space:
    build:
      context: .
      # The Dockerfile installs the tip of `main` by default. To run a release,
      # the way the Space does:
      #   args:
      #     NL2SQL_SPEC: "nl2sql-cli[web]==0.2.0"
      #     NL2SQL_ENGINE_SPEC: "nl2sql-engine==0.2.0"
      #     NL2SQL_API_SPEC: "nl2sql-api==0.2.0"
    image: nl2sql-demo:local
    ports:
      - "7860:7860"
    environment:
      PORT: "7860"
    # Hosted mode and the per-visitor limits are flags on the image's command
    # (`nl2sql-api serve --demo --hosted --questions-per-minute 6 --questions-per-session 30`);
    # a public demo must never be run without --hosted.
    # No volumes and no secrets on purpose: the sample data and its index are
    # baked into the image, and the server holds no API key.
    restart: unless-stopped
