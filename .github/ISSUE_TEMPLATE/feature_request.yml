name: Feature request
description: Suggest a change or an addition.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what stops you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The change you have in mind, and any alternative you considered.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine or pipeline
        - Adapter or database
        - REST API
        - Web app
        - CLI or terminal app
        - Documentation
        - Other
    validations:
      required: true
