name: Bug report
description: Something does not work as the docs say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, passwords or real data. For a security problem, use a private security advisory instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest config, command or code that shows it, and the question you asked if the answer was wrong.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `nl2sql --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, database and dialect, model provider.
  - type: textarea
    id: logs
    attributes:
      label: Output or trace
      description: The error, or the output of `nl2sql trace show` for a wrong answer. Remove secrets and rows you cannot share.
      render: text
