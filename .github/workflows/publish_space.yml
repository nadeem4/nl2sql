# Deploys the hosted playground (`nl2sql demo --hosted`) to its Hugging Face
# Space, `nadeem4nk/nl2sql-demo`.
#
# A release deploys it. publish_pypi.yaml calls this workflow with the release
# tag once that version is on PyPI and a fresh install of it from PyPI has
# booted (`pypi-smoke`), and afterwards polls the live Space until it reports
# that version (`space-smoke`). A push to main does not deploy: the public demo
# runs released code only. See docs/development/releasing.md.
#
# `deploy/huggingface/` is a Space root: a Dockerfile that needs no build
# context and a README whose front-matter is the Space configuration. This
# workflow mirrors that folder onto the Space's root, which is where the Hub
# looks for both, and then waits for the build.
#
# The mirror pins what the image installs by rewriting the Dockerfile's
# `ARG NL2SQL_SPEC=` line: to `nl2sql-engine[demo]==X.Y.Z` for a release, or to
# a GitHub archive of the checked-out commit when dispatched with no tag. It
# also writes that commit to SOURCE_SHA. A new release always changes the pin,
# so the Hub always has a new commit to rebuild on.
#
# The Space holds no API key and this workflow never gives it one: hosted mode
# takes each visitor's own key, per request. The only credential here is the
# Hugging Face *write* token, read from the `HF_TOKEN` repository secret.
name: Publish Space

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to deploy, e.g. v0.2.0. The image installs that version from PyPI.
        required: true
        type: string
      space_id:
        description: The Space to deploy to, as owner/name.
        required: false
        type: string
        default: nadeem4nk/nl2sql-demo
      token_secret:
        description: Name of the repository secret holding the Hugging Face write token.
        required: false
        type: string
        default: HF_TOKEN
    outputs:
      deployed:
        description: "'true' once a build of the pushed commit is RUNNING; empty when nothing was deployed."
        value: ${{ jobs.publish.outputs.deployed }}
  # The escape hatch: redeploy a release by hand, or rehearse on a scratch
  # Space. With a tag it does exactly what a release does. With no tag it
  # deploys the commit it was dispatched from, installed from git -- meant for
  # a `space_id` of your own, not the public demo.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, e.g. v0.2.0. Blank deploys this branch's commit from git (for a scratch Space).
        required: false
        default: ""
      space_id:
        description: The Space to deploy to, as owner/name.
        required: false
        default: nadeem4nk/nl2sql-demo
      token_secret:
        description: Name of the repository secret holding the Hugging Face write token.
        required: false
        default: HF_TOKEN
      # A redeploy of a release whose Space root is unchanged pushes nothing,
      # so the Hub starts no build on its own. A hand run is asked for because
      # the Space needs rebuilding, so it asks the Hub for a factory rebuild.
      factory_rebuild:
        description: Rebuild the Space from scratch when there is nothing new to push.
        required: false
        type: boolean
        default: true

# One deploy at a time. A run superseded by a newer one is cancelled rather
# than left to race it to the Space's main branch.
concurrency:
  group: publish-space
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.wait.outputs.deployed }}
    env:
      TAG: ${{ inputs.tag }}
      SPACE_ID: ${{ inputs.space_id || 'nadeem4nk/nl2sql-demo' }}
      # `huggingface_hub` reads HF_TOKEN from the environment, so no step has
      # to pass a token as an argument. On a fork, or before the secret is
      # added, this is empty and the job skips below.
      HF_TOKEN: ${{ secrets[inputs.token_secret || 'HF_TOKEN'] }}
      # Pinned: this job is a deploy, and a hub release should not change what
      # it does without a commit here.
      HUGGINGFACE_HUB_PIN: huggingface_hub==1.32.0
      SPACE_BUILD_TIMEOUT_SEC: "1800"
    steps:
      # The release's own commit, so the Space root deployed is the tagged one.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      # A fork has no access to the secret, and neither does this repository
      # before the owner adds it. Either way that is not a failure: say so and
      # leave the job green.
      - name: Look for the Hugging Face token
        id: token
        run: |
          set -euo pipefail
          if [ -n "${HF_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Hugging Face token in this repository (secret '${TOKEN_SECRET}' is unset), so the Space is not deployed."
            echo "Add a write token from https://huggingface.co/settings/tokens at https://github.com/nadeem4/nl2sql/settings/secrets/actions to enable this workflow."
            {
              echo "### Hugging Face Space not deployed"
              echo ""
              echo "The \`${TOKEN_SECRET}\` secret is not available to this run, so nothing was pushed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          TOKEN_SECRET: ${{ inputs.token_secret || 'HF_TOKEN' }}

      - uses: actions/setup-python@v5
        if: steps.token.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Install the Hugging Face hub client
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "$HUGGINGFACE_HUB_PIN"

      # `exist_ok` means an existing Space is left exactly as it is: the Hub
      # ignores visibility, SDK and hardware on a create that conflicts, so a
      # Space someone upgraded or made private is not reset by a deploy.
      - name: Create the Space if it does not exist
        if: steps.token.outputs.present == 'true'
        run: |
          python - <<'PY'
          import os

          from huggingface_hub import create_repo

          repo_id = os.environ["SPACE_ID"]
          url = create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="docker",
              private=False,
              exist_ok=True,
          )
          print(f"Space: {url}")
          PY

      # A release pins the image to the version it just uploaded, and the Hub
      # builds it straight away. v0.2.0's first Space build ran minutes after
      # the upload and pip saw only 0.1.x, although `pypi-smoke` had already
      # installed 0.2.0 from PyPI. So before pushing, wait (bounded: 20 x 30s)
      # until PyPI's simple index lists the version. The Dockerfile retries
      # its install as well, because the builder's view of the index can lag
      # this runner's. A dispatch with no tag installs from git and skips this.
      - name: Wait for PyPI's index to list the version
        if: steps.token.outputs.present == 'true' && inputs.tag != ''
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for attempt in $(seq 1 20); do
            if curl -fsSL \
                -H 'Accept: application/vnd.pypi.simple.v1+json' \
                -H 'Cache-Control: no-cache' \
                https://pypi.org/simple/nl2sql-engine/ \
              | python -c 'import json, sys; sys.exit(sys.argv[1] not in json.load(sys.stdin)["versions"])' "$version"
            then
              echo "PyPI's index lists nl2sql-engine $version."
              exit 0
            fi
            echo "Attempt $attempt of 20: PyPI's index does not list nl2sql-engine $version yet; retrying in 30s."
            sleep 30
          done
          echo "PyPI's index never listed nl2sql-engine $version; not pushing a Space that cannot install it."
          exit 1

      # Why a fresh working copy of the Space rather than `git subtree split`:
      # a split rewrites this repository's history for the prefix into a
      # synthetic one that shares no commits with whatever the Space already
      # has, so the very first push -- against the initial commit the Hub
      # creates with the Space -- is already a non-fast-forward and every
      # deploy would need `--force`, throwing the Space's history away. It also
      # needs `fetch-depth: 0` and gets slower as this repository grows.
      # Fetching the Space's own main and committing on top of it fast-forwards
      # every time, keeps every earlier deploy in the Space's log, and reads
      # four small files instead of the whole repository.
      - name: Push deploy/huggingface as the Space root
        id: push
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail

          source_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          if [ -n "$TAG" ]; then
            spec="nl2sql-engine[demo]==${TAG#v}"
          else
            spec="nl2sql-engine[demo] @ https://github.com/$GITHUB_REPOSITORY/archive/$source_sha.tar.gz#subdirectory=packages/nl2sql"
          fi
          {
            echo "source_sha=$source_sha"
            echo "spec=$spec"
          } >> "$GITHUB_OUTPUT"

          work="$RUNNER_TEMP/space"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
          git init --quiet --initial-branch=main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The token lives in this one shell variable and is expanded straight
          # into the git command line; it is never echoed, never traced (no
          # `set -x` above), and never written to .git/config -- which is why
          # the remote is passed to each command instead of being added.
          remote="https://user:$HF_TOKEN@huggingface.co/spaces/$SPACE_ID"

          if git ls-remote --exit-code --heads "$remote" main >/dev/null 2>&1; then
            git fetch --quiet "$remote" main
            git reset --quiet --hard FETCH_HEAD
            echo "Building on the Space's existing main."
          else
            echo "The Space has no main branch yet; this deploy creates it."
          fi

          # Mirror the folder onto the root, so a file deleted here is deleted
          # there. `.gitattributes` is the Hub's own (its LFS rules) and stays.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .gitattributes -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/deploy/huggingface/." .

          # Pin what the image installs, by rewriting the default in the pushed
          # copy -- a Space build takes no --build-arg from us. A release pins
          # the version it just put on PyPI; a dispatch with no tag pins this
          # commit, from git. The grep is the guard: if that line is ever
          # renamed, the deploy fails here instead of quietly shipping a Space
          # that builds something else.
          sed -i "s|^ARG NL2SQL_SPEC=.*|ARG NL2SQL_SPEC=\"$spec\"|" Dockerfile
          grep -qxF "ARG NL2SQL_SPEC=\"$spec\"" Dockerfile
          echo "The image installs: $spec"

          # And record the commit the Space root came from.
          printf '%s\n' "$source_sha" > SOURCE_SHA

          git add -A
          if git diff --cached --quiet; then
            echo "The Space root already installs $spec from $source_sha; nothing to push, so no build will run."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit --quiet -m "Deploy ${TAG:-$source_sha} from $GITHUB_REPOSITORY@$source_sha"
            git push --quiet "$remote" HEAD:refs/heads/main
            echo "Pushed ${TAG:-$source_sha} to https://huggingface.co/spaces/$SPACE_ID"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "space_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The job succeeds only when the Space ends RUNNING a build started for
      # this run. A push starts one. A run that pushed nothing -- a redeploy of
      # a release whose Space root is unchanged -- starts none, so it asks the
      # Hub for a factory rebuild when the Space is not running (or whenever a
      # hand run asks, which `factory_rebuild` does by default), then waits the
      # same way. Redeploying v0.2.0 used to log BUILD_ERROR and go green.
      - name: Wait for the Space to rebuild
        id: wait
        if: steps.token.outputs.present == 'true'
        env:
          PUSHED: ${{ steps.push.outputs.pushed }}
          SPACE_COMMIT: ${{ steps.push.outputs.space_commit }}
          SOURCE_SHA: ${{ steps.push.outputs.source_sha }}
          FACTORY_REBUILD: ${{ inputs.factory_rebuild }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time

          from huggingface_hub import HfApi

          repo_id = os.environ["SPACE_ID"]
          source_sha = os.environ["SOURCE_SHA"]
          pushed = os.environ.get("PUSHED") == "true"
          factory_rebuild = os.environ.get("FACTORY_REBUILD") == "true"
          expected = os.environ.get("SPACE_COMMIT") or ""
          timeout = int(os.environ["SPACE_BUILD_TIMEOUT_SEC"])
          api = HfApi()

          WORKING = {"BUILDING", "APP_STARTING", "RUNNING_BUILDING", "RUNNING_APP_STARTING"}
          BROKEN = {"BUILD_ERROR", "CONFIG_ERROR", "RUNTIME_ERROR", "NO_APP_FILE"}
          HALTED = {"PAUSED", "STOPPED", "DELETING"}


          def stage_now() -> str:
              stage = api.get_space_runtime(repo_id).stage
              return getattr(stage, "value", stage)


          def tail_of_the_build_log() -> str:
              try:
                  lines = list(api.fetch_space_logs(repo_id, build=True))
              except Exception as exc:  # the endpoint is best effort
                  return f"(could not read the build log: {exc})"
              return "".join(lines[-50:]) or "(the build log was empty)"


          def output(key: str, value: str) -> None:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write(f"{key}={value}\n")


          deadline = time.time() + timeout

          # The push is synchronous, but the repo metadata can lag it briefly.
          head_deadline = time.time() + 120
          while True:
              head = api.space_info(repo_id).sha
              if not expected or head == expected:
                  break
              if time.time() > head_deadline:
                  print(f"The Space's head is {head}, not the {expected} this run pushed.")
                  print("Something else pushed to the Space; re-run this workflow.")
                  sys.exit(1)
              time.sleep(5)
          print(f"The Space is at commit {head}, from {source_sha}.")

          # Nothing was committed, so the Hub started no build: whatever the
          # Space is serving, it is not this run's doing. Reading RUNNING as
          # this commit's success is how the Space once served four merges'
          # worth of stale code; reading BUILD_ERROR as nothing to do is how a
          # redeploy of v0.2.0 went green on a broken Space.
          if not pushed:
              stage = stage_now()
              print(f"Nothing to push: the Space root already carried this deploy. The Space is {stage}.")
              if factory_rebuild or (stage != "RUNNING" and stage not in WORKING):
                  why = "this run asked for one" if factory_rebuild else f"the Space is {stage}"
                  print(f"Asking the Hub for a factory rebuild, because {why}.")
                  api.restart_space(repo_id, factory_reboot=True)
                  output("rebuilt", "true")
              elif stage == "RUNNING":
                  # A re-run of a release that already reached the Space.
                  print("It is already serving this deploy.")
                  output("deployed", "true")
                  sys.exit(0)
              # Otherwise a build is already under way; wait for it below.

          # A pushed commit always moves the Dockerfile's pin or SOURCE_SHA, so
          # the Hub always has something to rebuild. A stage read before that
          # build starts can still be the previous build's error, so a broken
          # or halted stage ends the wait only once this build has been seen
          # working. One that never starts is a failure to report, not a
          # RUNNING to take credit for, and nothing but RUNNING is a success.
          grace = time.time() + 300
          seen_working = False
          last = None

          while True:
              stage = stage_now()
              if stage != last:
                  print(f"stage: {stage}", flush=True)
                  last = stage

              if stage in WORKING:
                  seen_working = True
              elif seen_working and stage == "RUNNING":
                  break
              elif seen_working and stage in BROKEN:
                  print(f"The Space is {stage}. The last of its build log:\n")
                  print(tail_of_the_build_log())
                  sys.exit(1)
              elif seen_working and stage in HALTED:
                  print(f"The Space is {stage}, so it will not come up on its own.")
                  sys.exit(1)
              if not seen_working and time.time() > grace:
                  print(f"The Space never started a build in the 5 minutes after this run; it is {stage}.")
                  if stage in BROKEN:
                      print(tail_of_the_build_log())
                  sys.exit(1)
              if time.time() > deadline:
                  print(f"Gave up after {timeout}s with the Space in {stage}.")
                  print(tail_of_the_build_log())
                  sys.exit(1)
              time.sleep(15)

          print(f"The Space rebuilt from {source_sha} and is running: https://huggingface.co/spaces/{repo_id}")
          output("deployed", "true")
          PY

      - name: Summarise the deploy
        if: steps.token.outputs.present == 'true' && success()
        run: |
          set -euo pipefail
          subdomain="$(echo "$SPACE_ID" | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
          if [ "${PUSHED:-false}" = "true" ]; then
            headline="### Hugging Face Space deployed"
            outcome="Rebuilt and running."
          elif [ "${REBUILT:-false}" = "true" ]; then
            headline="### Hugging Face Space rebuilt"
            outcome="**Factory rebuild.** The Space root already carried this deploy, so nothing was pushed; the Space was rebuilt from it and is running."
          else
            headline="### Hugging Face Space unchanged"
            outcome="**No rebuild.** The Space root already carried this deploy and the Space was running it, so nothing was pushed and no build ran."
          fi
          {
            echo "$headline"
            echo ""
            echo "$outcome"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Space | https://huggingface.co/spaces/$SPACE_ID |"
            echo "| Playground | https://$subdomain.hf.space |"
            echo "| Installs | \`$SPEC\` |"
            echo "| Source commit | \`$SOURCE_SHA\` |"
            echo "| Space commit | \`${SPACE_COMMIT:-unknown}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PUSHED: ${{ steps.push.outputs.pushed }}
          REBUILT: ${{ steps.wait.outputs.rebuilt }}
          SPACE_COMMIT: ${{ steps.push.outputs.space_commit }}
          SOURCE_SHA: ${{ steps.push.outputs.source_sha }}
          SPEC: ${{ steps.push.outputs.spec }}
