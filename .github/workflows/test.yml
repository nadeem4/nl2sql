name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The mssql and mysql adapters are omitted on purpose: they pull in
      # pyodbc / pymssql, which need system database drivers.
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/adapter-sdk -e packages/adapter-sqlalchemy -e packages/core -e packages/adapters/sqlite -e packages/adapters/postgres -e packages/cli -e packages/api pytest

      # Integration tests need a live database, a populated vector store and a
      # real OPENAI_API_KEY, so they cannot run here.
      - name: Run tests
        run: pytest -m "not integration"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build all distributions
        run: |
          for pkg in packages/adapter-sdk packages/adapter-sqlalchemy packages/core packages/cli packages/api packages/adapters/mssql packages/adapters/mysql packages/adapters/postgres packages/adapters/sqlite; do
            python -m build "$pkg" --outdir dist
          done

      - name: Smoke test the built wheels
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install --find-links dist dist/nl2sql_adapter_sdk-*.whl dist/nl2sql_adapter_sqlalchemy-*.whl dist/nl2sql_core-*.whl dist/nl2sql_sqlite-*.whl dist/nl2sql_cli-*.whl
          /tmp/smoke/bin/python -c "import nl2sql"
          /tmp/smoke/bin/nl2sql --help

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
