name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # True when the pull request touches anything but documentation, so the two
  # slow jobs below are skipped on a docs-only change. A skipped job counts as
  # passing for merge. Pushes to main always run them. The `docs` job still
  # builds the docs on every run.
  code-changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The mssql and mysql extras are omitted on purpose: they pull in
      # pyodbc / pymssql, which need system database drivers. Their adapters
      # still ship in the nl2sql package; only the drivers are absent. The
      # duckdb extra is installed because the DuckDB adapter tests run against
      # a real in-memory database and would fail without duckdb-engine. The
      # anthropic extra is installed so the Claude client tests run, against
      # the fake Anthropic endpoint in nl2sql.testing.fake_llm. The mcp extra
      # is installed so the MCP server's tests run rather than skip.
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/sdk -e "packages/nl2sql[postgres,duckdb,anthropic,otel,mcp]" -e packages/api pytest pytest-randomly

      # Anything needing generated demo data or a downloaded model is marked
      # `integration` and runs in the job below. Only the four modules whose
      # node under test calls a chat model are marked `llm`; those run nowhere
      # in CI. Tests marked `realdb` need the test bed's real servers and run
      # in realdb.yml.
      - name: Run tests
        run: pytest -m "not integration and not realdb"

  # The tests marked `integration` that need neither an LLM API key nor an
  # external database: the Chinook SQLite demo and the local ONNX embedder are
  # enough. Kept separate from the unit job so that one stays fast.
  integration:
    needs: code-changes
    if: needs.code-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      EMBEDDING_PROVIDER: local
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/sdk -e "packages/nl2sql[postgres,duckdb,anthropic,otel,mcp]" -e packages/api pytest pytest-randomly

      # all-MiniLM-L6-v2 is ~79 MB and immutable, so a fixed key is correct: a
      # hit skips the download entirely, and there is nothing to invalidate.
      - name: Cache the local embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-all-MiniLM-L6-v2

      # Writes the demo project (nl2sql.yaml, its section files and the three
      # sample databases) and indexes it, as a user's first two commands do.
      # No key is needed: the demo embeds locally and the LLM enrichment pass
      # is opt-in. A datasource that genuinely fails to index exits non-zero
      # and fails this step, which is the intent. The tests below build their
      # own projects and indexes.
      # `config check --connect` exits 1 on any problem in the written config,
      # before the index exists, so it also proves the check writes nothing.
      - name: Generate demo data
        run: |
          nl2sql init --demo demo-ci
          nl2sql --config demo-ci/nl2sql.yaml config check --connect
          test ! -e demo-ci/.nl2sql
          nl2sql --config demo-ci/nl2sql.yaml index

      # Indexing, datasource resolution, schema retrieval, aggregation,
      # physical validation and the local embedder -- plus tests/e2e, which
      # generates its own Chinook demo in a temp directory and drives the whole
      # graph through `nl2sql.testing.fake_llm`, an OpenAI-compatible fake, so
      # a full question-to-answer run is covered here with no API key. That
      # includes engine.evals.run(mode="plans") on the Chinook suite: every
      # hand-written gold plan through the validator, generator and executor,
      # once per demo role.
      - name: Run key-free integration tests
        run: pytest -m "integration and not llm"

  # The key-free eval gates, in parallel with `integration`: they need the
  # indexed demo and the model cache, not the integration tests.
  eval-gates:
    needs: code-changes
    if: needs.code-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      EMBEDDING_PROVIDER: local
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/sdk -e "packages/nl2sql[postgres,duckdb,anthropic,otel,mcp]" -e packages/api

      - name: Cache the local embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-all-MiniLM-L6-v2

      - name: Generate demo data
        run: |
          nl2sql init --demo demo-ci
          nl2sql --config demo-ci/nl2sql.yaml index

      # The key-free eval gate (docs/evals/index.md, "In CI"): mode plans
      # (every gold plan through the validator, generator and executor, for
      # every role) and mode retrieval on the demo's Chinook suite, and mode
      # retrieval on the routing suite (which demo database each question
      # goes to), each against the newest record of its mode and database in
      # benchmarks/. Exits 1 on a regression and 2 when there is no comparable
      # baseline (a suite, schema or routing change not yet re-recorded). Each
      # step runs whatever the others did. Mode full needs a key and refuses
      # to run in CI.
      - name: Eval gate (plans)
        if: ${{ !cancelled() }}
        run: nl2sql --config demo-ci/nl2sql.yaml eval run --mode plans --baseline benchmarks

      - name: Eval gate (retrieval)
        if: ${{ !cancelled() }}
        run: nl2sql --config demo-ci/nl2sql.yaml eval run --mode retrieval --baseline benchmarks

      - name: Eval gate (routing)
        if: ${{ !cancelled() }}
        run: nl2sql --config demo-ci/nl2sql.yaml eval run --mode retrieval --suite evals/routing.yaml --baseline benchmarks --out demo-ci/eval_routing.json

      # The full reports, pass or fail. CI's baselines are recorded from this
      # artifact, never on a laptop (benchmarks/README.md, "The recording
      # rule"): gh run download <run id> -n eval-reports, then
      # nl2sql eval publish.
      - name: Upload the eval reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: |
            demo-ci/eval_plans.json
            demo-ci/eval_retrieval.json
            demo-ci/eval_routing.json
          if-no-files-found: warn

  # Strict mode fails on broken internal links and bad references, which
  # catches the deterministic half of documentation drift. Claims that code
  # changes contradict are not checked by any workflow.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build docs (strict)
        run: python -m mkdocs build --strict --site-dir /tmp/site

  # The playground's unit tests (node --test) and its production build. The
  # build writes the single page that ships inside the nl2sql package; its size
  # goes to the job summary so growth shows up in review.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/playground
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/playground/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Built page size
        run: |
          size=$(wc -c < ../../packages/nl2sql/src/nl2sql/cli/demo/playground/static/index.html)
          echo "Built playground page: ${size} bytes" >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build all distributions
        run: |
          for pkg in packages/sdk packages/nl2sql packages/api; do
            python -m build "$pkg" --outdir dist
          done

      - name: Smoke test the built wheels
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install --find-links dist dist/nl2sql_sdk-*.whl dist/nl2sql_engine-*.whl dist/nl2sql_api-*.whl
          /tmp/smoke/bin/python -c "import nl2sql"
          /tmp/smoke/bin/nl2sql --help

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Builds the image the release's `ghcr` job publishes, the same way (repo
  # root as context, packages/api/Dockerfile named explicitly), and never
  # pushes it. Until this job existed nothing built that image before a
  # release did, so v0.2.0 reached PyPI with an image still on Python 3.11
  # that pip refused to install the packages into.
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image (no push)
        run: docker build -f packages/api/Dockerfile -t nl2sql-api:ci .

      - name: Import the API inside the image
        run: docker run --rm nl2sql-api:ci python -c "import nl2sql, nl2sql_api.main"

  # Installs the wheels `build` just made into an empty virtualenv the way a
  # user does -- `pip install "nl2sql-engine[demo]"` -- and boots
  # `nl2sql demo --hosted`, the command the Hugging Face Space runs, with no
  # API key. Passes only when the page, /api/meta, /api/schema and /api/index
  # all answer from that install. scripts/fresh_install_check.py is the whole
  # check, so it runs the same locally: `python scripts/fresh_install_check.py --build`.
  fresh-install:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # The same immutable model the integration job caches.
      - name: Cache the local embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-all-MiniLM-L6-v2

      - name: Install the wheels fresh and boot the demo
        run: python scripts/fresh_install_check.py --dist dist
