name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The mssql and mysql extras are omitted on purpose: they pull in
      # pyodbc / pymssql, which need system database drivers. Their adapters
      # still ship in the nl2sql package; only the drivers are absent.
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/adapter-sdk -e "packages/nl2sql[postgres]" -e packages/api pytest pytest-randomly

      # Anything needing generated demo data or a downloaded model is marked
      # `integration` and runs in the job below. Only the four modules whose
      # node under test calls a chat model are marked `llm`; those run nowhere
      # in CI.
      - name: Run tests
        run: pytest -m "not integration"

  # The subset of packages/core/tests/integration that needs neither an LLM API
  # key nor an external database: generated SQLite demo data and the local ONNX
  # embedder are enough. Kept separate from the unit job so that one stays fast.
  integration:
    runs-on: ubuntu-latest
    env:
      EMBEDDING_PROVIDER: local
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/adapter-sdk -e "packages/nl2sql[postgres]" -e packages/api pytest pytest-randomly

      # all-MiniLM-L6-v2 is ~79 MB and immutable, so a fixed key is correct: a
      # hit skips the download entirely, and there is nothing to invalidate.
      - name: Cache the local embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-all-MiniLM-L6-v2

      # Generates data/demo_lite/*.db and configs/*.demo.*. The schema-indexing
      # step this also runs needs no key: .env.demo embeds locally and the LLM
      # enrichment pass is optional, so it is skipped and logged at INFO. A
      # datasource that genuinely fails to index exits non-zero and fails this
      # step, which is the intent. The tests below build their own indexes.
      - name: Generate demo data
        run: nl2sql setup --demo --lite

      # 29 tests: indexing, datasource resolution, schema retrieval,
      # aggregation, physical validation and the local embedder.
      - name: Run key-free integration tests
        run: pytest -m "integration and not llm"

  # Strict mode fails on broken internal links and bad references, which is
  # the cheap, deterministic half of catching documentation drift. The
  # judgment-based half (claims contradicted by code changes) is the advisory
  # Claude review in docs_drift.yml.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build docs (strict)
        run: python -m mkdocs build --strict --site-dir /tmp/site

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build all distributions
        run: |
          for pkg in packages/adapter-sdk packages/nl2sql packages/api; do
            python -m build "$pkg" --outdir dist
          done

      - name: Smoke test the built wheels
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install --find-links dist dist/nl2sql_adapter_sdk-*.whl dist/nl2sql-*.whl dist/nl2sql_api-*.whl
          /tmp/smoke/bin/python -c "import nl2sql"
          /tmp/smoke/bin/nl2sql --help

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
