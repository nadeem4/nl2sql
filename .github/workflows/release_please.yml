# Runs on every push to main and maintains a single release pull request that
# accumulates Conventional Commits into CHANGELOG.md and bumps the unified
# version across all three package manifests. Merging that PR is the manual
# release gate: it tags vX.Y.Z and publishes a GitHub Release, which is what
# publish_pypi.yaml waits for. Nothing here publishes anything.
name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
