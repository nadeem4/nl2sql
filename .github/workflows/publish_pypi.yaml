# Publishes the vX.Y.Z release. Everything downstream of `build` is gated on
# that job: if the freshly built wheels do not install and import, nothing is
# published anywhere.
#
# Three entry points, one behaviour. GitHub does not start a workflow from an
# event created with the default `GITHUB_TOKEN`, so the tag release-please
# pushes never fires the `push: tags` trigger - `release_please.yml` therefore
# calls this workflow directly (`workflow_call`) off its own outputs. The tag
# trigger is kept for a human-pushed tag and `workflow_dispatch` is the manual
# escape hatch. See docs/development/releasing.md.
#
# The tag every job works from is `${{ inputs.tag || github.ref_name }}`:
# `inputs.tag` on a dispatched or called run, and the pushed tag otherwise.
# On a dispatched run `github.ref_name` is the branch, so every checkout, the
# GHCR image tag and `mike deploy` must use that expression, never the raw ref.
name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.1.0"
        required: true
        type: string

jobs:
  # Same build + smoke-install commands as the `build` job in test.yml, so a
  # green PR and a green tag exercise identical steps. This is the gate.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build all distributions
        run: |
          for pkg in packages/adapter-sdk packages/nl2sql packages/api; do
            python -m build "$pkg" --outdir dist
          done

      - name: Smoke test the built wheels
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install --find-links dist dist/nl2sql_adapter_sdk-*.whl dist/nl2sql_engine-*.whl dist/nl2sql_api-*.whl
          /tmp/smoke/bin/python -c "import nl2sql"
          /tmp/smoke/bin/nl2sql --help

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Trusted publishing (OIDC): the `id-token: write` permission is the whole
  # credential. There is no API token secret to configure or rotate - PyPI is
  # told which repository, workflow file and environment it will accept, once,
  # by hand. See docs/development/releasing.md.
  #
  # One leg per package, each in its own GitHub Environment. PyPI requires a
  # pending trusted publisher to be unique on (owner, repository, workflow,
  # environment); with three projects publishing from one repo and one workflow
  # the environment is the only field left to differ, so the second and third
  # registrations are rejected without it. The environment names below are the
  # contract with PyPI and must match the pending publisher entries exactly.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: nl2sql-engine
            stem: nl2sql_engine
          - package: nl2sql-api
            stem: nl2sql_api
          - package: nl2sql-adapter-sdk
            stem: nl2sql_adapter_sdk
    environment: pypi-${{ matrix.package }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # gh-action-pypi-publish uploads everything in packages-dir, so each leg
      # gets a directory holding only its own sdist and wheel. The trailing `-`
      # in the glob is load-bearing: `nl2sql_a*` would match both nl2sql_api
      # and nl2sql_adapter_sdk.
      - name: Stage the distributions for ${{ matrix.package }}
        run: |
          mkdir -p upload
          cp dist/${{ matrix.stem }}-*.tar.gz dist/${{ matrix.stem }}-*.whl upload/
          ls -1 upload/

      - name: Publish ${{ matrix.package }} to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

  # packages/api/Dockerfile installs nl2sql-adapter-sdk, nl2sql-engine and
  # nl2sql-api from the local sources, not from PyPI, and its COPY paths are
  # written relative to the repository root (`./packages/...`). COPY resolves
  # against the build context, so the context must be the repo root and the
  # Dockerfile has to be named explicitly with `file:`. Pointing `context` at
  # packages/api is what broke v0.1.0: buildx looked for
  # packages/api/packages/adapter-sdk and failed with "not found".
  #
  # `needs: pypi` is kept so the image is only published for a release that
  # actually made it onto PyPI; the build itself no longer depends on it.
  ghcr:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/api/Dockerfile
          push: true
          tags: |
            ghcr.io/nadeem4/nl2sql-api:${{ inputs.tag || github.ref_name }}
            ghcr.io/nadeem4/nl2sql-api:latest

  # mike keeps one built copy of the docs per tag on gh-pages and moves the
  # `latest` alias forward. Pushes to main deploy the `dev` version instead
  # (publish_docs.yml), so the two never write the same directory.
  docs:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Deploy versioned docs
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mike deploy --push --update-aliases "$TAG" latest
          mike set-default --push latest
