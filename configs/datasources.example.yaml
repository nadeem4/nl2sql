# Template: copy to configs/datasources.yaml and edit.
# Every dialect adapter ships with nl2sql; an extra supplies the driver
# (sqlite needs none). `${env:NAME}` is resolved from the environment.
version: 1
datasources:
  - id: chinook
    description: "Digital music store: artists, albums, tracks, customers, invoices."
    connection:
      type: sqlite
      database: "data/chinook.sqlite"
    statement_timeout_ms: 8000
    row_limit: 100
    max_bytes: 10485760
    tags: {env: dev, domain: catalog}

  - id: app_db
    description: "Primary application database."
    connection:
      type: postgres
      host: localhost
      port: 5432
      user: "${env:POSTGRES_USER}"
      password: "${env:POSTGRES_PASSWORD}"
      database: app
    statement_timeout_ms: 8000
    row_limit: 100
    max_bytes: 10485760
    tags: {env: dev, domain: application}

  - id: reporting_db
    description: "Reporting replica."
    connection:
      type: mysql
      host: localhost
      port: 3306
      user: "${env:MYSQL_USER}"
      password: "${env:MYSQL_PASSWORD}"
      database: reporting
    statement_timeout_ms: 8000
    row_limit: 100
    max_bytes: 10485760
    tags: {env: dev, domain: reporting}

  - id: warehouse
    description: "Data warehouse."
    connection:
      type: mssql
      host: 127.0.0.1
      port: 1433
      user: "${env:MSSQL_USER}"
      password: "${env:MSSQL_PASSWORD}"
      database: warehouse
      driver: "ODBC Driver 17 for SQL Server"
    statement_timeout_ms: 8000
    row_limit: 100
    max_bytes: 10485760
    tags: {env: dev, domain: warehouse}
